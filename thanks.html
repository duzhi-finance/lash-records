<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Noto+Serif+TC:wght@600;700&display=swap');
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:#FFFFFF;color:#2B2B2B;padding:24px;
  font-family:'Cormorant Garamond','Noto Serif TC',Georgia,serif;
}
.thanks-card{
  width:100%;max-width:360px;text-align:center;
  background:#fff;border:1px solid #EAEAEA;border-radius:12px;
  padding:44px 32px;box-shadow:0 1px 2px rgba(43,41,38,0.04),0 24px 60px rgba(43,41,38,0.1);
}
.thanks-brand{font-size:22px;font-weight:700;letter-spacing:1px;color:#AD8843;margin-bottom:22px;}
.thanks-title{font-size:20px;font-weight:700;color:#2B2B2B;margin:0 0 10px;}
.thanks-sub{font-size:13px;color:#777777;line-height:1.7;margin:0 0 24px;}
.spinner{
  width:26px;height:26px;margin:0 auto 24px;border-radius:50%;
  border:2.5px solid #EAEAEA;border-top-color:#AD8843;
  animation:spin 0.8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}
.thanks-btn{
  display:block;width:100%;padding:12px;border-radius:999px;
  background:#C5A059;color:#fff;text-decoration:none;
  font-family:ui-rounded,-apple-system,"PingFang TC","Noto Sans TC",sans-serif;
  font-size:14px;font-weight:600;letter-spacing:0.05em;margin-bottom:18px;
}
.thanks-hint{font-size:11.5px;color:#A69F97;line-height:1.7;font-family:ui-rounded,-apple-system,"PingFang TC","Noto Sans TC",sans-serif;}
.thanks-hint a{color:#AD8843;}

<body>
<div class="thanks-card">
  <div class="thanks-brand">EYELASH</div>
  <div class="spinner"></div>
  <h1 class="thanks-title">感謝購買！</h1>
  <p class="thanks-sub">正在為你準備工具頁面，即將自動跳轉…</p>

</div>
