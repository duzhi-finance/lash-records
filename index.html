<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Noto+Serif+TC:wght@600;700&family=Montserrat:wght@700;800&family=Noto+Sans+TC:wght@400;500;600;700&display=swap');
:root{
  --font-sans: ui-rounded, "Noto Sans TC", -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", "Helvetica Neue", Arial, sans-serif;
  --font-serif: 'Cormorant Garamond', 'Noto Serif TC', Georgia, 'Times New Roman', serif;
  --paper:#FAF6F2;
  --paper-deep:#F2E8DF;
  --ink:#4A4038;
  --ink-soft:#96897F;
  --ink-faint:#C7BAAF;
  --mocha:#C39A8C;
  --mocha-deep:#A97C6C;
  --blush:#EDDDD3;
  --blush-line:#DFC9BC;
  --alert:#9B6A4A;
  --alert-bg:#F3E3D6;
  --alert-line:#E2C7AE;
  --warn:#6B6459;
  --warn-bg:#EDEBE4;
  --warn-line:#D9D3C6;
  --sage:#4A4038;
  --sage-bg:#F1E7DD;
  --radius-card:14px;
  --radius-pill:999px;
  --radius-ui:9px;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font-sans);
  font-size:15px;
  line-height:1.6;
  min-height:100vh;
}
h1,h2,h3{
  font-family:var(--font-sans);
  font-weight:600;
  color:var(--ink);
  margin:0;
}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;font-size:14px;}
:focus-visible{outline:2px solid var(--mocha-deep);outline-offset:2px;}

#app{max-width:960px;margin:0 auto;padding:32px 24px 80px;}

/* ---------- Top bar ---------- */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:26px;flex-wrap:wrap;gap:12px;
  background:var(--paper-deep);
  border-radius:var(--radius-card);
  padding:20px 24px;
}
.brand{display:flex;flex-direction:column;gap:4px;}
.brand-row{display:flex;align-items:baseline;gap:12px;}
.brand-en{
  font-family:'Montserrat', var(--font-sans);
  font-size:10.5px;letter-spacing:2.5px;text-transform:uppercase;color:var(--ink-faint);
}
.brand .wordmark{
  font-family:var(--font-serif);
  font-size:30px;letter-spacing:0.5px;font-weight:700;color:var(--mocha-deep);
}
.brand span.sub{font-size:12.5px;color:var(--ink-soft);}
.list-footer{margin-top:40px;padding-top:20px;border-top:1px solid var(--blush-line);text-align:center;}
.list-footer-en{
  font-family:'Montserrat', var(--font-sans);
  font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--ink-faint);
}
.list-footer-copyright{margin-top:8px;font-size:10.5px;line-height:1.6;color:var(--ink-faint);}

.btn{
  border:1px solid var(--mocha);
  background:var(--mocha);
  color:#fff;
  padding:9px 18px;
  border-radius:var(--radius-pill);
  font-size:14px;
  font-weight:500;
  transition:background .15s ease, transform .05s ease;
}
.btn:hover{background:var(--mocha-deep);border-color:var(--mocha-deep);}
.btn:active{transform:translateY(1px);}
.btn-ghost{
  background:#fff;color:var(--ink);border:1px solid var(--blush-line);border-radius:var(--radius-pill);
}
.btn-ghost:hover{background:var(--sage-bg);}
.btn-text{
  background:none;border:none;color:var(--mocha-deep);padding:6px 4px;
  font-size:13.5px;
}
.btn-danger-text{
  background:none;border:none;color:var(--ink-soft);padding:6px 4px;
  font-size:13px;
}
.btn-danger-text:hover{color:var(--alert);}
.btn-sage{
  border:1px solid var(--ink);background:var(--ink);color:#fff;
  padding:9px 18px;border-radius:var(--radius-pill);font-size:14px;font-weight:500;
}
.btn-sage:hover{background:#000;}
.btn-sm{padding:6px 14px;font-size:13px;}

/* ---------- Top bar action group ---------- */
.topbar-actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center;}
.icon-btn-group{display:flex;gap:8px;flex-wrap:wrap;padding-right:12px;border-right:1px solid var(--blush-line);}
.icon-btn-group--footer{justify-content:center;border-right:none;padding-right:0;margin-bottom:18px;}
.icon-btn{
  height:38px;border-radius:var(--radius-pill);flex-shrink:0;
  background:#fff;border:1px solid var(--blush-line);color:var(--ink-soft);
  display:flex;align-items:center;gap:7px;padding:0 13px;
}
.icon-btn .icon-btn-glyph{font-size:15px;line-height:1;}
.icon-btn .icon-btn-label{display:flex;flex-direction:column;line-height:1.2;text-align:left;}
.icon-btn .icon-btn-label .zh{font-size:12.5px;color:var(--ink);}
.icon-btn .icon-btn-label .en{font-size:8.5px;letter-spacing:0.5px;color:var(--ink-faint);}
.icon-btn:hover{background:var(--sage-bg);border-color:var(--mocha);}

/* ---------- Storage notice ---------- */
.storage-notice{
  display:flex;align-items:flex-start;gap:10px;
  background:var(--warn-bg);
  border:1px solid var(--warn-line);
  color:var(--warn);
  border-radius:var(--radius-card);
  padding:14px 16px;
  margin-bottom:20px;
  font-size:13px;
  line-height:1.6;
}
.storage-notice .icon{flex-shrink:0;font-size:16px;line-height:1.4;}
.storage-notice strong{font-weight:700;}

/* ---------- List view ---------- */
.search-row{margin-bottom:20px;}
.search-input{
  width:100%;padding:11px 16px;
  border:1px solid var(--blush-line);
  border-radius:var(--radius-ui);
  background:#fff;
  font-size:14.5px;
}
.client-list{display:flex;flex-direction:column;border:1px solid var(--blush-line);border-radius:var(--radius-card);overflow:hidden;}
.client-card{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 18px;
  border-bottom:1px solid var(--blush-line);
  cursor:pointer;
  gap:14px;
  background:#fff;
}
.client-card:last-child{border-bottom:none;}
.client-card:hover{background:var(--sage-bg);}
.client-main{display:flex;flex-direction:column;gap:3px;min-width:0;}
.client-name{font-family:var(--font-serif);font-size:19px;font-weight:700;}
.client-meta{font-size:12.5px;color:var(--ink-soft);}
.client-side{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.tag-count{
  display:inline-flex;align-items:center;gap:5px;
  background:var(--warn-bg);color:var(--warn);
  border:1px solid var(--warn-line);
  padding:4px 10px;border-radius:var(--radius-pill);
  font-size:12px;font-weight:600;
}
.quick-add-btn{
  width:30px;height:30px;border-radius:50%;
  background:var(--mocha);color:#fff;border:none;
  font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.quick-add-btn:hover{background:var(--mocha-deep);}
.empty-state{
  padding:60px 20px;text-align:center;color:var(--ink-soft);
}
.empty-state h3{
  margin-bottom:8px;font-size:21px;font-weight:700;color:var(--mocha-deep);
  font-family:var(--font-serif);letter-spacing:0.3px;
  display:flex;align-items:center;justify-content:center;gap:9px;
}

/* ---------- Detail view ---------- */
.back-row{margin-bottom:16px;}
.client-card-hero{
  background:var(--paper-deep);
  border-radius:var(--radius-card);
  padding:20px 22px;
  margin-bottom:18px;
}
.client-card-top{
  display:flex;justify-content:space-between;align-items:flex-start;
  gap:16px;flex-wrap:wrap;margin-bottom:12px;
}
.client-card-top h1{font-family:var(--font-serif);font-size:28px;font-weight:700;display:flex;align-items:center;gap:8px;}
.card-info-row{display:flex;flex-wrap:wrap;gap:8px 16px;margin-bottom:14px;}
.card-info-item{font-size:13px;color:var(--ink-soft);}
.client-tags-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-top:12px;border-top:1px solid var(--blush-line);}
.client-tag-pill{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--blush);color:var(--mocha-deep);
  padding:4px 6px 4px 11px;border-radius:var(--radius-pill);font-size:12.5px;font-weight:500;
}
.client-tag-pill button{
  background:var(--mocha-deep);color:#fff;border:none;border-radius:50%;
  width:14px;height:14px;font-size:9.5px;line-height:1;display:flex;align-items:center;justify-content:center;
}

/* Contraindication banner - always visible, neutral gray/khaki so it doesn't compete with brand accent colors */
.banner-alert{
  background:var(--warn-bg);
  border:1px solid var(--warn-line);
  border-radius:var(--radius-card);
  padding:16px 18px;
  margin-bottom:22px;
}
.banner-alert .banner-title{
  display:flex;align-items:center;gap:8px;
  font-weight:600;color:var(--warn);font-size:14.5px;margin-bottom:10px;
}
.tag-pills{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
.tag-pill{
  display:inline-flex;align-items:center;gap:8px;
  background:#fff;border:1px solid var(--warn-line);color:var(--warn);
  padding:6px 8px 6px 12px;border-radius:var(--radius-pill);font-size:13.5px;font-weight:500;
}
.tag-pill button{
  background:var(--warn);color:#fff;border:none;border-radius:50%;
  width:16px;height:16px;font-size:11px;line-height:1;display:flex;align-items:center;justify-content:center;
}
.tag-add-row{display:flex;gap:8px;}
.tag-add-row input{
  flex:1;padding:8px 12px;border:1px solid var(--warn-line);border-radius:var(--radius-ui);
  background:#fff;font-size:13.5px;
}
.tag-add-row button{
  background:var(--warn);color:#fff;border:1px solid var(--warn);
  padding:8px 16px;border-radius:var(--radius-pill);font-size:13.5px;font-weight:500;
}

/* Tab switcher: 客人狀況 / 服務紀錄 (stacked full-width, avoids a long side-by-side scroll on mobile) */
.detail-tabs{display:flex;gap:8px;margin-bottom:16px;}
.detail-tab-btn{
  flex:1;background:#fff;border:1px solid var(--blush-line);color:var(--ink-soft);
  padding:10px 16px;border-radius:var(--radius-pill);font-size:13.5px;font-weight:500;
  text-align:center;
}
.detail-tab-btn.active{background:var(--ink);color:#fff;border-color:var(--ink);}
.revisit-flag{color:var(--mocha-deep);font-weight:600;}
.prev-record-ref{
  background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:var(--radius-ui);
  padding:10px 12px;margin-bottom:10px;font-size:12.5px;color:var(--ink-soft);line-height:1.5;
}
.prev-record-ref-title{font-weight:600;color:var(--warn);margin-bottom:3px;}

.panel{
  background:#fff;
  border:1px solid var(--blush-line);
  border-radius:var(--radius-card);
  padding:20px 20px 22px;
}
.panel-title{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:16px;
}
.panel-title h2{font-size:16px;display:flex;align-items:center;gap:7px;}
.panel-title small{font-size:11.5px;color:var(--ink-faint);}

.status-field{margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--blush-line);}
.status-field:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
.status-field label{
  display:block;font-size:13px;color:var(--ink);margin-bottom:8px;font-weight:500;
}
.tri-toggle{display:inline-flex;border:1px solid var(--blush-line);border-radius:var(--radius-pill);overflow:hidden;}
.tri-toggle button{
  background:#fff;border:none;padding:6px 14px;font-size:13px;color:var(--ink-soft);
  border-right:1px solid var(--blush-line);
}
.tri-toggle button:last-child{border-right:none;}
.tri-toggle button.active-yes,
.tri-toggle button.active-no,
.tri-toggle button.active-unknown,
.tri-toggle button.active{background:var(--ink);color:#fff;}
.status-field input[type="text"], .status-field input[type="date"]{
  width:100%;padding:8px 10px;border:1px solid var(--blush-line);border-radius:var(--radius-ui);
  background:#fff;font-size:13.5px;
}
.status-note{
  margin-top:8px;width:100%;padding:7px 9px;border:1px solid var(--blush-line);
  border-radius:var(--radius-ui);background:#fff;font-size:13px;resize:vertical;min-height:38px;
}
.status-footer{
  display:flex;align-items:center;justify-content:space-between;margin-top:16px;
  padding-top:16px;border-top:1px solid var(--blush-line);
}
.status-updated{font-size:11.5px;color:var(--ink-faint);}

/* Pre-service consent & questionnaire */
.consent-list{display:flex;flex-direction:column;gap:2px;border-radius:var(--radius-ui);overflow:hidden;background:var(--blush-line);}
.consent-item{
  display:flex;gap:12px;align-items:flex-start;background:#fff;padding:14px 16px;
  font-size:13.5px;color:var(--ink);line-height:1.6;cursor:pointer;
}
.consent-item:has(input:checked){background:var(--sage-bg);}
.consent-item input[type="checkbox"]{margin-top:3px;width:18px;height:18px;flex-shrink:0;accent-color:var(--mocha-deep);}
.signature-wrap{
  border:1px solid var(--blush-line);border-radius:var(--radius-ui);background:#fff;
  overflow:hidden;
}
#signature-canvas{display:block;width:100%;height:180px;touch-action:none;cursor:crosshair;}
.consent-summary{
  background:var(--sage-bg);border:1px solid var(--blush-line);border-radius:var(--radius-ui);
  padding:12px 14px;
}
.consent-summary-label{font-size:12.5px;color:var(--ink-soft);font-weight:600;}
.consent-signature{display:block;margin-top:8px;max-height:80px;background:#fff;border:1px solid var(--blush-line);border-radius:6px;}

/* Service records */
.service-history{display:flex;flex-direction:column;gap:10px;}
.record-card{
  background:#fff;border:1px solid var(--blush-line);border-radius:var(--radius-card);
  padding:15px 18px;
}
.record-top{display:flex;justify-content:space-between;align-items:baseline;cursor:pointer;gap:10px;}
.record-date{font-size:15.5px;font-weight:600;}
.record-tech{font-size:12px;color:var(--mocha-deep);background:var(--blush);padding:3px 11px;border-radius:var(--radius-pill);}
.record-summary{font-size:12.5px;color:var(--ink-soft);margin-top:4px;}
.record-body{margin-top:12px;padding-top:12px;border-top:1px solid var(--blush-line);}
.record-detail-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-bottom:14px;}
.record-detail-item label{display:block;font-size:11px;color:var(--ink-faint);margin-bottom:2px;}
.record-detail-item span{font-size:13.5px;}
.record-notes{font-size:13px;color:var(--ink-soft);margin-top:8px;white-space:pre-wrap;}

/* Eye segment diagram: a lash-line arc with 3 marker lines (left/mid/right, mid longest)
   for recording extension length per segment */
.eye-diagrams{display:flex;gap:16px;margin-bottom:6px;flex-wrap:wrap;}
.eye-diagram-block{flex:1;min-width:150px;}
.eye-diagram-block .eye-label{font-size:11.5px;color:var(--ink-soft);margin-bottom:5px;text-align:center;}
.eye-svg-wrap{
  background:#fff;border:1px solid var(--blush-line);border-radius:var(--radius-ui);
  padding:6px;
}
.eye-svg-wrap svg{width:100%;height:auto;display:block;}
.eye-arc{stroke:var(--mocha);stroke-width:2.5;stroke-linecap:round;}
.eye-seg-line{stroke:var(--mocha-deep);stroke-width:2.5;stroke-linecap:round;}
.seg-inputs{display:flex;gap:6px;margin-top:6px;}
.seg-inputs input{
  width:100%;padding:6px 4px;text-align:center;border:1px solid var(--blush-line);
  border-radius:var(--radius-ui);font-size:12.5px;background:#fff;color:var(--ink);
}
.seg-display{display:flex;justify-content:space-around;margin-top:6px;font-size:12px;color:var(--ink-soft);}
.field-hint{font-size:11.5px;color:var(--ink-faint);line-height:1.5;margin-top:5px;}

/* New service form */
.new-record-panel{
  background:#fff;border:1px solid var(--blush-line);border-radius:var(--radius-card);
  padding:22px 22px 20px;margin-bottom:16px;
}
.new-record-title{
  font-family:var(--font-serif);font-size:19px;font-weight:700;color:var(--mocha-deep);
  letter-spacing:0.2px;margin-bottom:18px;
}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}
.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:12px;}
@media (max-width:480px){.form-row, .form-row-3{grid-template-columns:1fr;}}
/* Grid items default to min-width:auto, which lets an oversized native control (see the
   iOS date/time note below) refuse to shrink to its column and overflow the row. */
.form-row > *, .form-row-3 > *{min-width:0;}
.form-field--narrow input, .form-field--narrow .date-field-wrap{max-width:150px;}
.form-field label{
  display:block;font-size:12.5px;color:var(--mocha-deep);margin-bottom:6px;font-weight:600;
  letter-spacing:0.1px;
}
.form-field input, .form-field select, .form-field textarea{
  width:100%;padding:9px 11px;border:1px solid var(--blush-line);border-radius:var(--radius-ui);
  background:#fff;font-size:14px;color:var(--ink);transition:border-color .15s ease;
  font-family:var(--font-sans);
}
.form-field input:focus, .form-field select:focus, .form-field textarea:focus{border-color:var(--mocha);}
.form-field select{
  appearance:none;-webkit-appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'><path d='M1,1 L6,6 L11,1' fill='none' stroke='%23A97C6C' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/></svg>");
  background-repeat:no-repeat;background-position:right 10px center;background-size:11px;
  padding-right:28px;cursor:pointer;
}
.form-field textarea{resize:vertical;min-height:50px;}
/* Blank date/time boxes until clicked: hide the browser's mm/dd/yyyy hint text
   while empty and unfocused; typing/picking removes the .date-empty class immediately */
input[type="date"].date-empty:not(:focus)::-webkit-datetime-edit,
input[type="time"].date-empty:not(:focus)::-webkit-datetime-edit{color:transparent;}

/* Calendar/clock icon: a wrapper + absolutely-positioned SVG (see dateFieldIcon() in the
   script), not a background-image on the input. iOS Safari never renders a native
   picker-indicator icon the way desktop Chrome does, so the box looked empty on phones;
   and a background-image on the input itself rendered inconsistently near the input's
   own rounded corners across browsers. The wrapper sidesteps both problems and keeps the
   icon reliably inset with a fixed, generous margin from the edge. */
.date-field-wrap{position:relative;display:block;width:100% !important;min-width:0;}
.date-field-wrap input[type="date"], .date-field-wrap input[type="time"]{
  cursor:pointer;padding-right:38px !important;
  /* iOS Safari keeps its own native control chrome on date/time inputs unless appearance
     is reset, and that native chrome can ignore our width:100% and force the box wider
     than its container — this is what was pushing the box (and the icon riding on its
     edge) past the screen. Resetting appearance makes it obey our CSS box model instead.
     Forced with !important since the fix must hold regardless of which platform default
     it's fighting — the same rule must produce an identical width to every plain text
     input on the page, no exceptions. */
  -webkit-appearance:none !important;appearance:none !important;
  width:100% !important;max-width:100% !important;min-width:0 !important;box-sizing:border-box !important;
  display:block !important;
  /* No visible box for date/time fields — just the icon (and the picked date/time once
     set) sitting directly on the page, no border or fill. */
  border:none !important;background:transparent !important;padding-left:0 !important;
}
.date-field-icon{
  position:absolute;top:50%;right:14px;transform:translateY(-50%);
  width:16px;height:16px;pointer-events:none;
}
input[type="date"]::-webkit-calendar-picker-indicator,
input[type="time"]::-webkit-calendar-picker-indicator{
  opacity:0;cursor:pointer;
}
.form-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:14px;}
.chip-select{display:flex;flex-wrap:wrap;gap:8px;}
.chip{
  background:#fff;border:1px solid var(--blush-line);color:var(--ink-soft);
  padding:7px 14px;border-radius:var(--radius-pill);font-size:13px;
}
.chip.active{background:var(--ink);color:#fff;border-color:var(--ink);}
.chip-add-row{display:flex;gap:6px;margin-top:8px;}
.chip-add-row input{
  flex:1;padding:6px 12px;border:1px solid var(--blush-line);border-radius:var(--radius-pill);
  background:#fff;font-size:12.5px;color:var(--ink);
}
.chip-add-row button{
  background:var(--mocha);color:#fff;border:none;border-radius:50%;
  width:28px;height:28px;font-size:14px;flex-shrink:0;cursor:pointer;
}

/* Modal */
.modal-overlay{
  position:fixed;inset:0;background:rgba(43,41,38,0.35);
  display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;
}
.modal-box{
  background:#fff;border:1px solid var(--blush-line);border-radius:var(--radius-card);
  padding:26px;width:100%;max-width:380px;
}
.modal-box h3{font-size:18px;margin-bottom:18px;display:flex;align-items:center;gap:8px;}
.modal-field{margin-bottom:14px;}
.modal-field label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:5px;}
.modal-field input, .modal-field select{
  width:100%;padding:9px 12px;border:1px solid var(--blush-line);border-radius:var(--radius-ui);
  background:#fff;font-size:14px;color:var(--ink);transition:border-color .15s ease;
}
.modal-field input:focus, .modal-field select:focus{border-color:var(--mocha);}
.modal-field select{
  appearance:none;-webkit-appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'><path d='M1,1 L6,6 L11,1' fill='none' stroke='%23A97C6C' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/></svg>");
  background-repeat:no-repeat;background-position:right 12px center;background-size:11px;
  padding-right:32px;cursor:pointer;
}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;}

.footer-links{margin-top:34px;padding-top:16px;border-top:1px solid var(--blush-line);text-align:right;}

/* ---------- Revenue stat (home) ---------- */
.revenue-card{
  background:var(--paper-deep);border-radius:var(--radius-card);
  padding:18px 22px;margin-bottom:18px;
  display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:8px;
}
.revenue-card .revenue-label{font-size:13px;color:var(--ink-soft);font-weight:500;display:inline-flex;align-items:center;gap:6px;}
.revenue-card .revenue-amount{font-family:var(--font-serif);font-size:26px;font-weight:700;color:var(--mocha-deep);}

/* ---------- Calendar / appointments ---------- */
.calendar-header{background:var(--paper-deep);border-radius:var(--radius-card);padding:18px 22px;margin-bottom:16px;}
.calendar-header h1{font-family:var(--font-serif);font-size:26px;font-weight:700;display:flex;align-items:center;gap:9px;}
.status-legend{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:16px;font-size:12px;color:var(--ink-soft);}
.legend-item{display:flex;align-items:center;gap:6px;}
.legend-dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex-shrink:0;}
.legend-dot.status-confirmed{background:var(--mocha-deep);}
.legend-dot.status-completed{background:var(--ink);}
.legend-dot.status-cancelled{background:var(--ink-faint);}
.legend-dot.status-noshow{background:var(--warn);}

.week-grid-scroll{overflow-x:auto;margin-bottom:20px;border-radius:var(--radius-card);}
.week-grid{
  display:grid;
  border:1px solid var(--blush-line);border-radius:var(--radius-card);
  overflow:hidden;background:#fff;
}
.grid-corner{height:45px;border-bottom:1px solid var(--blush-line);}
.hour-label{
  border-bottom:1px solid var(--blush-line);box-sizing:border-box;
  font-size:10px;color:var(--ink-faint);text-align:right;padding:2px 6px 0 0;
}
.day-col-header{
  height:45px;box-sizing:border-box;cursor:pointer;
  padding:6px 6px 0;text-align:center;border-bottom:1px solid var(--blush-line);border-left:1px solid var(--blush-line);
  color:var(--ink-soft);
}
.day-col-header .dow{display:block;font-size:10.5px;}
.day-col-header .daynum{display:block;font-size:16px;font-weight:700;color:var(--ink);line-height:1.3;}
.day-col-header.is-today{background:var(--blush);}
.day-col-header.is-selected{background:var(--mocha-deep);}
.day-col-header.is-selected .dow, .day-col-header.is-selected .daynum{color:#fff;}
.day-col-body{position:relative;border-left:1px solid var(--blush-line);}
.hour-row-line{position:absolute;left:0;right:0;border-top:1px solid var(--blush-line);}
.appt-block{
  position:absolute;left:3px;right:3px;border-radius:6px;padding:3px 6px;overflow:hidden;
  font-size:10.5px;line-height:1.35;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.1);
}
.appt-block .appt-time{font-weight:700;display:block;}
.appt-block .appt-name{display:block;font-weight:600;}
.appt-block .appt-service{display:block;opacity:.85;}
.appt-block.status-confirmed{background:var(--blush);color:var(--mocha-deep);}
.appt-block.status-completed{background:var(--ink);color:#fff;}
.appt-block.status-cancelled{background:var(--paper-deep);color:var(--ink-faint);}
.appt-block.status-noshow{background:var(--warn-bg);color:var(--warn);}
.week-nav{display:flex;justify-content:center;gap:8px;margin-bottom:22px;}
.agenda-panel{background:#fff;border:1px solid var(--blush-line);border-radius:var(--radius-card);padding:20px 20px 22px;}
.agenda-panel .panel-title h2{font-family:var(--font-serif);font-size:20px;font-weight:700;}
.agenda-list{display:flex;flex-direction:column;gap:10px;}
.agenda-row{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  border:1px solid var(--blush-line);border-radius:var(--radius-ui);padding:12px 14px;
}
.agenda-time{font-size:13.5px;font-weight:700;color:var(--ink);min-width:48px;}
.agenda-main{flex:1;min-width:120px;}
.agenda-client{font-weight:600;font-size:14.5px;cursor:pointer;}
.agenda-client:hover{color:var(--mocha-deep);}
.agenda-service{font-size:12.5px;color:var(--ink-soft);}
.agenda-amount{font-size:13px;color:var(--ink-soft);min-width:70px;text-align:right;}
.agenda-actions{display:flex;gap:6px;}
.status-pill{
  border:none;border-radius:var(--radius-pill);padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer;
}
.status-pill.status-confirmed{background:var(--blush);color:var(--mocha-deep);}
.status-pill.status-completed{background:var(--ink);color:#fff;}
.status-pill.status-cancelled{background:var(--paper-deep);color:var(--ink-faint);}
.status-pill.status-noshow{background:var(--warn-bg);color:var(--warn);}
</style>
</head>
<body>
<div id="app">載入中…</div>

<script>
/* ============ Storage helpers ============
 * This app runs as a plain static page (GitHub Pages), so all data lives
 * only in this browser's localStorage on this device. There is no server
 * and no sync between devices/browsers — see the export/import backup
 * functions below for how users move data between devices.
 */
const STORAGE_KEY = 'meiye-clients-data';
let clients = [];

async function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    clients = raw ? JSON.parse(raw) : [];
  }catch(e){
    clients = [];
  }
}
async function saveData(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(clients));
  }catch(e){
    console.error('儲存失敗', e);
    showToast('資料儲存失敗，請稍後再試一次（可能是瀏覽器儲存空間已滿）。');
  }
}

function uid(prefix){
  return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
}
function todayStr(){
  return new Date().toISOString().slice(0,10);
}
function fmtDate(d){
  if(!d) return '—';
  return d;
}
function escapeHtml(str){
  if(str===undefined||str===null) return '';
  return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
/* A small calendar/clock glyph drawn as our own absolutely-positioned SVG rather than a
   background-image on the input itself — browsers clip/position a native input's own
   background inconsistently near its rounded corners, which made the icon look like it
   was cutting outside the box. Wrapping the input keeps the icon reliably inset. */
function dateFieldIcon(kind){
  const path = kind==='time'
    ? `<circle cx='12' cy='12' r='9'/><polyline points='12 7 12 12 16 14'/>`
    : `<rect x='3' y='5' width='18' height='16' rx='2'/><line x1='3' y1='10' x2='21' y2='10'/><line x1='8' y1='2.5' x2='8' y2='6'/><line x1='16' y1='2.5' x2='16' y2='6'/>`;
  return `<svg class="date-field-icon" viewBox="0 0 24 24" fill="none" stroke="#A97C6C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${path}</svg>`;
}

/* ============ Backup: export / import ============ */
function exportBackup(){
  const payload = {
    app: 'eyelash-client-records',
    version: 1,
    exportedAt: new Date().toISOString(),
    clients,
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `eyelash-backup-${todayStr()}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  showToast('已匯出備份檔案，請妥善保存');
}
function triggerImport(){
  const input = document.getElementById('import-file-input');
  if(input) input.click();
}
function handleImportFile(evt){
  const file = evt.target.files && evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    let parsed;
    try{
      parsed = JSON.parse(e.target.result);
    }catch(err){
      showToast('匯入失敗：檔案不是有效的備份格式');
      evt.target.value='';
      return;
    }
    const importedClients = Array.isArray(parsed) ? parsed
      : (parsed && Array.isArray(parsed.clients) ? parsed.clients : null);
    if(!importedClients){
      showToast('匯入失敗：找不到客戶資料');
      evt.target.value='';
      return;
    }
    const currentCount = clients.length;
    askConfirm(
      `確定要匯入這份備份檔案嗎？匯入後將會取代目前裝置上所有的客戶紀錄（目前共 ${currentCount} 筆，備份檔內有 ${importedClients.length} 筆），此操作無法復原。建議先匯出目前的資料備份。`,
      async ()=>{
        clients = importedClients;
        await saveData();
        view='list'; activeClientId=null;
        render();
        showToast(`已匯入 ${clients.length} 筆客戶紀錄`);
      }
    );
    evt.target.value='';
  };
  reader.onerror = function(){
    showToast('匯入失敗：無法讀取檔案');
    evt.target.value='';
  };
  reader.readAsText(file);
}

/* ============ App state ============ */
let view = 'list';          // 'list' | 'detail'
let activeClientId = null;
let showAddClientModal = false;
let editClientDraft = null; // {id?, name, phone}
let statusDraft = null;     // working copy of client.status while on detail page
let newRecordDraft = null;  // working copy for a new service record
let expandedRecordId = null;
let detailTab = 'status';   // 'status' | 'records'
let consentDraft = null;    // {clientId, checks:[bool x5], signatureDataUrl} while on consent view
let consentError = '';
let calendarSelectedDate = null; // 'YYYY-MM-DD', set on entering calendar view

const APPT_STATUSES = ['confirmed','completed','cancelled','noshow'];
const APPT_STATUS_LABELS = {confirmed:'已確認', completed:'已完成', cancelled:'已取消', noshow:'未到'};

const STATUS_FIELDS = [
  {key:'isFirstTime', label:'是否第一次接睫毛', tri:true},
  {key:'lastLashDate', label:'上次接睫毛日期', type:'date'},
  {key:'keratin3Months', label:'近三個月是否操作角蛋白', tri:true},
  {key:'keratinFrequency', label:'角蛋白／燙睫毛平均頻率', type:'text', placeholder:'例如：約2個月一次'},
  {key:'frequency', label:'平常接睫毛頻率', type:'text', placeholder:'例如：約3週一次'},
  {key:'hasOldLashesToRemove', label:'目前是否有舊睫毛需要卸除', tri:true},
  {key:'allergyHistory', label:'是否有過敏／敏感史（含鼻子／眼睛過敏或發炎）', tri:true, note:true},
  {key:'eyeRednessItchyDry', label:'眼睛是否容易紅癢／乾', tri:true},
  {key:'recentEyeDiscomfort', label:'近期是否有眼睛不適', tri:true, note:true},
  {key:'wearsContacts', label:'平常是否配戴隱形眼鏡', tri:true},
  {key:'wearsGlasses', label:'平常是否需要戴眼鏡', tri:true},
  {key:'rubsEyesOften', label:'平常是否容易揉眼睛', tri:true},
  {key:'specialEyeCondition', label:'是否有特殊眼部狀況', tri:true, note:true},
  {key:'eyeSurgeryHistory', label:'是否有割雙眼皮、近視雷射、紋繡眉／眼線等手術', tri:true, note:true},
  {key:'sleepPosition', label:'是否有趴睡或側睡習慣', tri:true},
  {key:'isPregnant', label:'目前是否懷孕', tri:true},
  {key:'oilyEyelids', label:'眼皮是否容易出油', tri:true},
  {key:'lashCareHabit', label:'是否有保養睫毛習慣、使用產品類型', tri:true, note:true},
  {key:'makeupHabit', label:'上妝習慣、化妝程度', type:'text', placeholder:'例如：淡妝／濃妝／著重眼妝／無化妝'},
  {key:'falseLashHabit', label:'日常配戴假睫毛類型', type:'text', placeholder:'例如：濃密型／自然型／無配戴習慣'},
  {key:'eyeMakeupRemover', label:'日常眼部卸妝用品', type:'text', placeholder:'例如：卸妝油、眼唇卸妝液'},
  {key:'faceMakeupRemover', label:'日常臉部卸妝用品', type:'text', placeholder:'例如：卸妝乳、卸妝水'},
  {key:'faceWashHabit', label:'洗臉習慣', type:'text', placeholder:'例如：毛巾／潑水式／淋浴沖洗／洗臉海綿／洗臉刷機'},
];
/* Questionnaire keys shown on the pre-service consent & questionnaire screen: everything
   except lastLashDate/hasOldLashesToRemove/specialEyeCondition, which stay in 客人狀況 only
   (per-visit specifics an artist checks, not something to ask the client to self-report). */
const QUESTIONNAIRE_FIELD_KEYS = ['isFirstTime','keratin3Months','keratinFrequency','frequency',
  'allergyHistory','eyeRednessItchyDry','recentEyeDiscomfort','wearsContacts','wearsGlasses',
  'rubsEyesOften','eyeSurgeryHistory','sleepPosition','isPregnant','oilyEyelids','lashCareHabit',
  'makeupHabit','falseLashHabit','eyeMakeupRemover','faceMakeupRemover','faceWashHabit'];
const CONSENT_ITEMS = [
  '同意最終成果因個人睫毛生長、健康程度、濃密度和眼型而有所不同，服務完成後無法要求退費',
  '若有眼疾、過敏、動過眼部手術或紋繡服務會主動告知，若因個人體質產生不適現象店家可免責',
  '了解接睫過程可能帶來的不適感（流淚、紅眼、過敏現象）',
  '接受睫毛脫落速度因個人體質、生活習慣、保養方式不同而不同',
  '了解卸除睫毛須由專業美睫師處理，自行卸除可能傷害真睫毛',
];

function blankStatus(){
  const s = {};
  STATUS_FIELDS.forEach(f=>{
    if(f.tri) s[f.key] = 'unknown';
    else s[f.key] = '';
    if(f.note) s[f.key+'_note'] = '';
  });
  return s;
}


const TECHNIQUES = ['單根','歐美','3D','4D','6D','Y Y','其他'];
const SERVICE_ITEMS = ['全新嫁接','補睫','卸睫','其他'];
const CONTRAINDICATION_PRESETS = ['眼睛敏感','過敏體質','隱形眼鏡配戴者','睫毛膠過敏','乾眼症','蟹足腫體質','懷孕／哺乳中'];

/* ---- Custom style presets (persisted separately from client data) ---- */
const DEFAULT_STYLE_OPTIONS = ['自然款','精緻款','混合款','仙女款'];
const STYLE_STORAGE_KEY = 'meiye-custom-styles';
let customStyleOptions = [];
async function loadCustomStyles(){
  try{
    const raw = localStorage.getItem(STYLE_STORAGE_KEY);
    customStyleOptions = raw ? JSON.parse(raw) : [];
  }catch(e){
    customStyleOptions = [];
  }
}
async function saveCustomStyles(){
  try{
    localStorage.setItem(STYLE_STORAGE_KEY, JSON.stringify(customStyleOptions));
  }catch(e){
    console.error('儲存款式失敗', e);
  }
}
function allStyleOptions(){
  return DEFAULT_STYLE_OPTIONS.concat(customStyleOptions);
}
function serviceLabelOf(r){
  if(!r.service) return '';
  return r.service==='其他' ? (r.serviceOther||'其他') : r.service;
}

/* ============ Rendering ============ */
function render(){
  document.querySelectorAll('.modal-overlay').forEach(el=>el.remove());
  const app = document.getElementById('app');
  if(view==='list'){
    app.innerHTML = renderListView();
  }else if(view==='calendar'){
    app.innerHTML = renderCalendarView();
  }else if(view==='consent'){
    app.innerHTML = renderConsentView();
    attachConsentBehaviors();
  }else{
    const client = clients.find(c=>c.id===activeClientId);
    if(!client){ view='list'; app.innerHTML = renderListView(); return; }
    app.innerHTML = renderDetailView(client);
    attachDetailBehaviors(client);
  }
  if(showAddClientModal){
    document.body.insertAdjacentHTML('beforeend', renderClientModal());
  }
  if(pendingConfirm){
    document.body.insertAdjacentHTML('beforeend', renderConfirmModal());
  }
}

/* ---- List view ---- */
let searchTerm = '';
function renderListView(){
  const term = searchTerm.trim().toLowerCase();
  const filtered = clients.filter(c=>{
    if(!term) return true;
    return (c.name||'').toLowerCase().includes(term) || (c.phone||'').includes(term);
  }).sort((a,b)=> (a.name||'').localeCompare(b.name||'', 'zh-Hant'));

  let cardsHtml = '';
  if(clients.length===0){
    cardsHtml = `<div class="empty-state">
      <h3>還沒有客戶紀錄</h3>
      <p>新增第一位客戶，開始取代紙本記事卡。</p>
    </div>`;
  }else if(filtered.length===0){
    cardsHtml = `<div class="empty-state"><p>找不到符合「${escapeHtml(searchTerm)}」的客戶。</p></div>`;
  }else{
    cardsHtml = '<div class="client-list">' + filtered.map(c=>{
      const lastVisit = latestServiceDate(c) || c.status.lastLashDate || '';
      const tagCount = (c.contraindications||[]).length;
      return `<div class="client-card" onclick="openClient('${c.id}')">
        <div class="client-main">
          <div class="client-name">${escapeHtml(c.name)}</div>
          <div class="client-meta">${c.phone?escapeHtml(c.phone)+' · ':''}${lastVisit?'上次：'+escapeHtml(lastVisit):'尚無服務紀錄'}</div>
        </div>
        <div class="client-side">
          ${tagCount>0?`<span class="tag-count">留意 ${tagCount}</span>`:''}
          <button class="quick-add-btn" title="快速新增服務紀錄" onclick="event.stopPropagation(); quickAddRecord('${c.id}')">＋</button>
        </div>
      </div>`;
    }).join('') + '</div>';
  }

  const countLine = clients.length>0
    ? `<div style="font-size:12.5px;color:var(--ink-faint);margin-bottom:12px;">共 ${clients.length} 位客戶${term && filtered.length!==clients.length ? `，符合搜尋 ${filtered.length} 位` : ''}</div>`
    : '';

  return `
    <div class="topbar">
      <div class="brand">
        <div class="brand-row">
          <h1 class="wordmark">EYELASH</h1>
          <span class="sub">獨立美睫師的客戶紀錄本</span>
        </div>
        <div class="brand-en">FOR INDEPENDENT LASH ARTISTS</div>
      </div>
      <div class="topbar-actions">
        <button class="btn" onclick="openAddClientModal()">＋ 新增客戶</button>
        <input type="file" id="import-file-input" accept="application/json,.json" style="display:none" onchange="handleImportFile(event)">
      </div>
    </div>
    <div class="storage-notice">
      <span class="icon">⚠️</span>
      <span><strong>資料僅儲存在此裝置、此瀏覽器（localStorage）。</strong>換一台裝置、換一個瀏覽器，或清除瀏覽器資料／快取，都會讓紀錄遺失且無法復原。建議定期使用下方「匯出備份」保存檔案，重灌設備或清除資料前務必先匯出。</span>
    </div>
    <div class="revenue-card">
      <span class="revenue-label">本月營收</span>

function getWeekDates(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  const sunday = new Date(d);
  sunday.setDate(d.getDate()-d.getDay());
  const arr = [];
  for(let i=0;i<7;i++){
    const x = new Date(sunday);
    x.setDate(sunday.getDate()+i);
    arr.push(x.toISOString().slice(0,10));
  }
  return arr;
}

}
function collectAppointmentsForDate(dateStr){
  const results = [];
  clients.forEach(c=>{
    (c.serviceRecords||[]).forEach(r=>{
      if(r.date===dateStr){
        results.push(Object.assign({}, r, {clientName:c.name, clientId:c.id}));
      }
    });
  });
  results.sort((a,b)=> (a.time||'99:99').localeCompare(b.time||'99:99'));
  return results;
}
async function cycleAppointmentStatus(clientId, recordId){
  const client = clients.find(c=>c.id===clientId);
  const r = client && client.serviceRecords.find(x=>x.id===recordId);
  if(!r) return;
  const cur = r.status || 'confirmed';
  const idx = APPT_STATUSES.indexOf(cur);
  r.status = APPT_STATUSES[(idx+1) % APPT_STATUSES.length];
  await saveData();
  render();
}
const CAL_START_HOUR = 9;
const CAL_END_HOUR = 21;
const CAL_HOUR_PX = 52;
function timeToMinutes(t){
  if(!t) return null;
  const parts = String(t).split(':');
  const h = parseInt(parts[0],10), m = parseInt(parts[1]||'0',10);
  if(isNaN(h)) return null;
  return h*60+(isNaN(m)?0:m);
}
function isMobileViewport(){
  return window.innerWidth <= 640;
}
function renderWeekGrid(weekDates, selectedDate){
  const gridHeight = (CAL_END_HOUR-CAL_START_HOUR)*CAL_HOUR_PX;
  const weekdayLabels = ['日','一','二','三','四','五','六'];
  const mobile = weekDates.length <= 3;
  const gutterWidth = mobile ? 44 : 52;
  const gridStyle = mobile
    ? `grid-template-columns:${gutterWidth}px repeat(${weekDates.length},1fr);`
    : `grid-template-columns:${gutterWidth}px repeat(${weekDates.length},minmax(112px,1fr));min-width:860px;`;
  const hourLabels = [];
  for(let h=CAL_START_HOUR; h<=CAL_END_HOUR; h++){
    hourLabels.push(`<div class="hour-label" style="height:${CAL_HOUR_PX}px;">${String(h).padStart(2,'0')}:00</div>`);
  }
  const dayCols = weekDates.map(dateStr=>{
    const d = new Date(dateStr+'T00:00:00');
    const isToday = dateStr===todayStr();
    const isSelected = dateStr===selectedDate;
    const appts = collectAppointmentsForDate(dateStr).filter(r=>timeToMinutes(r.time)!==null);
    const blocks = appts.map(r=>{
      const startMin = Math.max(timeToMinutes(r.time), CAL_START_HOUR*60);
      const durMin = Number(r.duration)||60;
      const top = (startMin - CAL_START_HOUR*60)/60*CAL_HOUR_PX;
      const height = Math.max(durMin/60*CAL_HOUR_PX, 22);
      const status = r.status||'confirmed';
      const serviceLabel = serviceLabelOf(r)||r.style||'';
      return `<div class="appt-block status-${status}" style="top:${top}px;height:${height}px;" onclick="startEditRecord('${r.clientId}','${r.id}')" title="${escapeHtml(r.clientName)} ${escapeHtml(r.time)}">
        <span class="appt-time">${escapeHtml(r.time)}</span>
        <span class="appt-name">${escapeHtml(r.clientName)}</span>
        ${serviceLabel?`<span class="appt-service">${escapeHtml(serviceLabel)}</span>`:''}
      </div>`;
    }).join('');
    const hourLines = [];
    for(let h=CAL_START_HOUR; h<CAL_END_HOUR; h++){
      hourLines.push(`<div class="hour-row-line" style="top:${(h-CAL_START_HOUR)*CAL_HOUR_PX}px;"></div>`);
    }
    return `<div>
      <div class="day-col-header ${isToday?'is-today':''} ${isSelected?'is-selected':''}" onclick="selectCalendarDate('${dateStr}')">
        <span class="dow">週${weekdayLabels[d.getDay()]}</span>
        <span class="daynum">${d.getDate()}</span>
      </div>
      <div class="day-col-body" style="height:${gridHeight}px;">
        ${hourLines.join('')}
        ${blocks}
      </div>
    </div>`;
  }).join('');

  return `<div class="week-grid-scroll"><div class="week-grid" style="${gridStyle}">
    <div>
      <div class="grid-corner"></div>
      ${hourLabels.join('')}
    </div>
    ${dayCols}
  </div></div>`;
}
function getMiniDateRange(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  const arr = [];
  for(let i=-1;i<=1;i++){
    const x = new Date(d);
    x.setDate(d.getDate()+i);
    arr.push(x.toISOString().slice(0,10));
  }
  return arr;
}

function latestServiceDate(client){
  const recs = client.serviceRecords||[];
  if(recs.length===0) return null;
  return recs.slice().sort((a,b)=> b.date.localeCompare(a.date))[0].date;
}
function computeRevisitStats(client){
  const recs = (client.serviceRecords||[]).slice().sort((a,b)=> a.date.localeCompare(b.date));
  if(recs.length < 2) return null;
  const dates = recs.map(r=> new Date(r.date+'T00:00:00'));
  let totalGapDays = 0;
  for(let i=1;i<dates.length;i++){
    totalGapDays += (dates[i]-dates[i-1]) / 86400000;
  }
  const avgDays = totalGapDays / (dates.length-1);
  const lastDate = dates[dates.length-1];
  const todayDate = new Date(todayStr()+'T00:00:00');
  const sinceLastDays = Math.round((todayDate-lastDate)/86400000);
  return {
    avgWeeks: avgDays/7,
    sinceLastWeeks: sinceLastDays/7,
    isOverdue: sinceLastDays > avgDays*1.2,
  };
}
function computeMonthlyRevenue(){
  const monthPrefix = todayStr().slice(0,7);
  let total = 0;
  clients.forEach(c=>{
    (c.serviceRecords||[]).forEach(r=>{
      if(!r.date || !r.date.startsWith(monthPrefix)) return;
      if(r.status==='completed'){
        total += Number(r.amount)||0;
      }else if(r.status==='noshow'){
        total += Number(r.deposit)||0;
      }
    });
  });
  return total;
}

/* ---- Pre-service consent & questionnaire ----
 * Gate shown before every new service record (not edits, not calendar bookings for
 * unlinked clients): consent checkboxes + a lifestyle questionnaire that reuses the
 * client's existing 客人狀況 fields (so overlapping questions — allergy history, contacts,
 * eye-rubbing — aren't asked twice) + a signature pad. On completion it hands off straight
 * into the normal new-record form with the signature/consent timestamp already attached. */
function startConsentFlow(clientId, opts){
  opts = opts || {};
  activeClientId = clientId;
  const client = clients.find(c=>c.id===clientId);
  statusDraft = JSON.parse(JSON.stringify(client.status));
  consentDraft = {clientId, copyFromLast: !!opts.copyFromLast, checks:[false,false,false,false,false], signatureDataUrl:null};
  consentError = '';
  expandedRecordId = null;
  detailTab = 'records';
  view = 'consent';
  render();
}
function cancelConsentFlow(){
  const clientId = consentDraft ? consentDraft.clientId : activeClientId;
  consentDraft = null;
  consentError = '';
  view = 'detail';
  activeClientId = clientId;
  render();
}
function toggleConsentCheck(idx){
  consentDraft.checks[idx] = !consentDraft.checks[idx];
}
function clearSignature(){
  consentDraft.signatureDataUrl = null;
  const canvas = document.getElementById('signature-canvas');
  if(canvas){
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
}
function attachConsentBehaviors(){
  const canvas = document.getElementById('signature-canvas');
  if(!canvas) return;
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#4A4038';
  ctx.lineWidth = 2.2;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  if(consentDraft.signatureDataUrl){
    const img = new Image();
    img.onload = function(){ ctx.drawImage(img, 0, 0, rect.width, rect.height); };
    img.src = consentDraft.signatureDataUrl;
  }
  let drawing = false;
  canvas.addEventListener('pointerdown', function(e){
    drawing = true;
    canvas.setPointerCapture(e.pointerId);
    const r = canvas.getBoundingClientRect();
    ctx.beginPath();
    ctx.moveTo(e.clientX - r.left, e.clientY - r.top);
  });
  canvas.addEventListener('pointermove', function(e){
    if(!drawing) return;
    const r = canvas.getBoundingClientRect();
    ctx.lineTo(e.clientX - r.left, e.clientY - r.top);
    ctx.stroke();
  });
  function finishStroke(){
    if(!drawing) return;
    drawing = false;
    consentDraft.signatureDataUrl = canvas.toDataURL('image/png');
  }
  canvas.addEventListener('pointerup', finishStroke);
  canvas.addEventListener('pointercancel', finishStroke);
}
function renderConsentView(){
  const client = clients.find(c=>c.id===consentDraft.clientId);
  const consentHtml = CONSENT_ITEMS.map((text,i)=>{
    const checked = consentDraft.checks[i];
    return `<label class="consent-item">
      <input type="checkbox" ${checked?'checked':''} onchange="toggleConsentCheck(${i})">
      <span>${i+1}. ${escapeHtml(text)}</span>
    </label>`;
  }).join('');
  const questionnaireHtml = QUESTIONNAIRE_FIELD_KEYS.map(key=>{
    const f = STATUS_FIELDS.find(x=>x.key===key);
    return f ? renderStatusFieldHtml(f) : '';
  }).join('');

  return `
    <div class="back-row">
      <button class="btn-text" onclick="cancelConsentFlow()">← 返回客戶詳細頁</button>
    </div>
    <div class="client-card-hero">
      <div class="client-card-top"><h1>客人同意書與問卷</h1></div>
      <div class="card-info-row"><span class="card-info-item">${escapeHtml(client.name)}</span></div>
      <p class="field-hint" style="margin-top:10px;">每次新增服務紀錄前，請先與客人一起完成以下確認與問卷。完成後會直接繼續填寫這次的服務紀錄，不需要再手動輸入一次。</p>
    </div>
    <div class="panel">
      <div class="panel-title"><h2>A．諮詢紀錄同意書</h2></div>
      <div class="consent-list">${consentHtml}</div>
    </div>
    <div class="panel" id="status-panel" style="margin-top:16px;">
      <div class="panel-title"><h2>B．生活紀錄調查表</h2></div>
      ${questionnaireHtml}
    </div>
    <div class="panel" style="margin-top:16px;">
      <div class="panel-title"><h2>C．客人簽名</h2></div>
      <div class="signature-wrap">
        <canvas id="signature-canvas"></canvas>
      </div>
      <div class="form-actions" style="margin-top:10px;">
        <button type="button" class="btn-ghost btn btn-sm" onclick="clearSignature()">清除簽名</button>
      </div>
    </div>
    ${consentError ? `<div id="consent-error" style="color:var(--alert);font-size:13px;margin:14px 0 0;">${escapeHtml(consentError)}</div>` : ''}
    <div class="form-actions">
      <button class="btn-ghost btn" onclick="cancelConsentFlow()">取消</button>
      <button class="btn" onclick="submitConsentAndContinue()">完成，開始新增服務紀錄</button>
    </div>
  `;
}
async function submitConsentAndContinue(){
  if(!consentDraft.checks.every(Boolean)){
    consentError = '請先勾選以上全部同意事項，再繼續下一步。';
    render();
    document.getElementById('consent-error')?.scrollIntoView({behavior:'smooth', block:'center'});
    return;
  }
  const unansweredKey = QUESTIONNAIRE_FIELD_KEYS.find(key=>{
    const f = STATUS_FIELDS.find(x=>x.key===key);
    if(!f) return false;
    const val = statusDraft[key];
    return f.tri ? (!val || val==='unknown') : !String(val||'').trim();
  });
  if(unansweredKey){
    const f = STATUS_FIELDS.find(x=>x.key===unansweredKey);
    consentError = `問卷全部項目都需要填寫，尚未完成：「${f.label}」。`;
    render();
    document.getElementById('consent-error')?.scrollIntoView({behavior:'smooth', block:'center'});
    return;
  }
  if(!consentDraft.signatureDataUrl){
    consentError = '請客人在下方簽名欄簽名後再繼續。';
    render();
    document.getElementById('consent-error')?.scrollIntoView({behavior:'smooth', block:'center'});
    return;
  }

  const clientId = consentDraft.clientId;
  const copyFromLast = consentDraft.copyFromLast;
  const signatureDataUrl = consentDraft.signatureDataUrl;
  const consentAgreedAt = todayStr();

  const client = clients.find(c=>c.id===clientId);
  client.status = JSON.parse(JSON.stringify(statusDraft));
  client.statusUpdatedAt = consentAgreedAt;
  await saveData();

  newRecordDraft = copyFromLast
    ? recordDraftFromLast(clientId, findLatestRecord(clientId, null))
    : blankRecordDraft(clientId);
  newRecordDraft.consentAgreed = true;
  newRecordDraft.consentAgreedAt = consentAgreedAt;
  newRecordDraft.signatureDataUrl = signatureDataUrl;

  view = 'detail';
  detailTab = 'records';
  expandedRecordId = null;
  consentDraft = null;
  consentError = '';
  render();
  const panel = document.getElementById('new-record-panel');
  if(panel) panel.scrollIntoView({behavior:'smooth', block:'nearest'});
}

      <datalist id="client-name-list">${clients.map(c=>`<option value="${escapeHtml(c.name)}">`).join('')}</datalist>
    </div>
    <div class="form-field" style="margin-bottom:12px;">
      <label>出生年月日（選填）</label>
      <div class="date-field-wrap">
        <input type="date" class="${d.clientBirthday?'':'date-empty'}" value="${escapeHtml(d.clientBirthday||'')}" oninput="newRecordDraft.clientBirthday=this.value; this.classList.toggle('date-empty', !this.value)">
        ${dateFieldIcon('date')}
      </div>
    </div>
    <div class="form-field" style="margin-bottom:12px;">
      <label>約的日期</label>
      <div class="date-field-wrap">
        <input type="date" class="${d.date?'':'date-empty'}" value="${d.date||''}" oninput="newRecordDraft.date=this.value; this.classList.toggle('date-empty', !this.value)">
        ${dateFieldIcon('date')}
      </div>
    </div>
    <div class="form-field" style="margin-bottom:12px;">
      <label>時間（選填）</label>
      <div class="date-field-wrap">
        <input type="time" class="${d.time?'':'date-empty'}" value="${escapeHtml(d.time||'')}" oninput="newRecordDraft.time=this.value; this.classList.toggle('date-empty', !this.value)">
        ${dateFieldIcon('time')}
      </div>
    </div>
    <div id="new-record-error" style="color:var(--alert);font-size:12.5px;margin-bottom:6px;"></div>
    <div class="form-actions">
      <button class="btn-ghost btn" onclick="cancelNewRecord()">取消</button>
      <button class="btn" onclick="saveNewRecord()">儲存預約</button>
    </div>
  </div>`;
}
function renderNewRecordPanel(){
  const d = newRecordDraft;
  if(!d.clientId && !d.id){
    return renderMinimalAppointmentForm(d);
  }
  const prevRecord = d.clientId ? findLatestRecord(d.clientId, d.id) : null;
  const prevRefHtml = prevRecord ? `<div class="prev-record-ref">
      <div class="prev-record-ref-title">上一筆紀錄參考（${prevRecord.date}）</div>
      <div>${escapeHtml(summarizeRecord(prevRecord))}</div>
      ${prevRecord.adjustmentNotes?`<div>上次調整：${escapeHtml(prevRecord.adjustmentNotes)}</div>`:''}
    </div>` : '';
  const clientPickerHtml = !d.clientId ? `
    <div class="form-field" style="margin-bottom:12px;">
      <label>客人姓名（輸入現有客人姓名可自動連結，或輸入新姓名建立新客人）</label>
      <input type="text" list="client-name-list" value="${escapeHtml(d.clientPickerName||'')}" placeholder="輸入客人姓名" oninput="newRecordDraft.clientPickerName=this.value">
      <datalist id="client-name-list">${clients.map(c=>`<option value="${escapeHtml(c.name)}">`).join('')}</datalist>
    </div>` : '';
  const apptStatus = d.status || 'confirmed';

  return `<div class="new-record-panel" id="new-record-panel">
    <div class="new-record-title">${d.id?'編輯服務紀錄':(d.clientId?'新增服務紀錄':'新增預約')}</div>
    ${d.consentAgreed?`<div class="consent-summary" style="margin-bottom:14px;">
      <div class="consent-summary-label">✓ 同意書與問卷已完成（${escapeHtml(d.consentAgreedAt||'')}）</div>
      ${d.signatureDataUrl?`<img class="consent-signature" src="${d.signatureDataUrl}" alt="客人簽名">`:''}
    </div>`:''}
    <div class="form-row-3">
      <div class="form-field form-field--narrow"><label>日期</label>
        <div class="date-field-wrap">
          <input type="date" class="${d.date?'':'date-empty'}" value="${d.date}" oninput="newRecordDraft.date=this.value; this.classList.toggle('date-empty', !this.value)">
          ${dateFieldIcon('date')}
        </div>
      </div>
      <div class="form-field form-field--narrow"><label>時間（選填）</label>
        <div class="date-field-wrap">
          <input type="time" class="${d.time?'':'date-empty'}" value="${escapeHtml(d.time||'')}" oninput="newRecordDraft.time=this.value; this.classList.toggle('date-empty', !this.value)">
          ${dateFieldIcon('time')}
        </div>
      </div>
      <div class="form-field form-field--narrow"><label>時長（選填）</label>
        <input type="number" min="10" step="10" value="${escapeHtml(d.duration||'')}" placeholder="例如：90分鐘" oninput="newRecordDraft.duration=this.value">
      </div>
    </div>
    ${clientPickerHtml}
    <div class="form-field" style="margin-bottom:12px;">
      <label>服務項目</label>
      <div class="chip-select">
        ${SERVICE_ITEMS.map((s,i)=>`<button type="button" class="chip ${d.service===s?'active':''}" onclick="setServiceItemByIndex(${i})">${escapeHtml(s)}</button>`).join('')}
      </div>
      ${d.service==='其他'?`<input type="text" style="margin-top:8px;" placeholder="請輸入服務項目名稱" value="${escapeHtml(d.serviceOther||'')}" oninput="newRecordDraft.serviceOther=this.value">`:''}
    </div>
    <div class="form-field" style="margin-bottom:12px;">
      <label>預約狀態</label>
      <div class="tri-toggle" data-field="apptStatus">
        ${APPT_STATUSES.map(s=>`<button type="button" class="${apptStatus===s?'active':''}" onclick="setApptStatus('${s}')">${APPT_STATUS_LABELS[s]}</button>`).join('')}
      </div>
    </div>
    <div class="form-row">
      <div class="form-field"><label>金額</label>
        <input type="number" min="0" value="${escapeHtml(d.amount||'')}" placeholder="服務金額" oninput="newRecordDraft.amount=this.value">
      </div>
      <div class="form-field"><label>訂金（選填）</label>
        <input type="number" min="0" value="${escapeHtml(d.deposit||'')}" placeholder="若有先收訂金" oninput="newRecordDraft.deposit=this.value">
      </div>
    </div>
    <div class="field-hint" style="margin:-8px 0 12px;">訂金只在客人「未到」時才會用到：客人爽約但有先收訂金，這筆訂金會算進本月營收；正常完成服務的話不用填，「金額」會直接算進營收。</div>
    <div class="form-field" style="margin-bottom:12px;">
      <label>款式</label>
      <div class="chip-select">
        ${allStyleOptions().map((s,i)=>`<button type="button" class="chip ${d.style===s?'active':''}" onclick="setStyleChipByIndex(${i})">${escapeHtml(s)}</button>`).join('')}
      </div>
      <div class="chip-add-row">
        <input type="text" id="new-style-input" placeholder="新增自訂款式" onkeydown="if(event.key==='Enter'){event.preventDefault(); addCustomStyle();}">
        <button type="button" onclick="addCustomStyle()">＋</button>
      </div>
    </div>
    <div class="form-field" style="margin-bottom:14px;">
      <label>眼睛示意圖（由左至右依序填入各段嫁接長度）</label>
      <div class="eye-diagrams">
        <div class="eye-diagram-block">
          <div class="eye-label">左眼</div>
          <div class="eye-svg-wrap">${eyeArcSvg('L')}</div>
          <div class="seg-inputs">
            <input type="text" placeholder="左段" value="${escapeHtml(d.lenLL||'')}" oninput="newRecordDraft.lenLL=this.value">
            <input type="text" placeholder="中段" value="${escapeHtml(d.lenLM||'')}" oninput="newRecordDraft.lenLM=this.value">
            <input type="text" placeholder="右段" value="${escapeHtml(d.lenLR||'')}" oninput="newRecordDraft.lenLR=this.value">
          </div>
        </div>
        <div class="eye-diagram-block">
          <div class="eye-label">右眼</div>
          <div class="eye-svg-wrap">${eyeArcSvg('R')}</div>
          <div class="seg-inputs">
            <input type="text" placeholder="左段" value="${escapeHtml(d.lenRL||'')}" oninput="newRecordDraft.lenRL=this.value">
            <input type="text" placeholder="中段" value="${escapeHtml(d.lenRM||'')}" oninput="newRecordDraft.lenRM=this.value">
            <input type="text" placeholder="右段" value="${escapeHtml(d.lenRR||'')}" oninput="newRecordDraft.lenRR=this.value">
          </div>
        </div>
      </div>
    </div>
    <div class="form-field" style="margin-bottom:12px;">
      <label>眼型設計說明（選填）</label>
      <textarea placeholder="例如：中間加長，眼尾稍微收短" oninput="newRecordDraft.designNotes=this.value">${escapeHtml(d.designNotes)}</textarea>
    </div>
    <div class="form-field" style="margin-bottom:12px;">
      <label>本次調整（選填，依上次回饋）</label>
      ${prevRefHtml}
      <textarea placeholder="例如：上次客人覺得眼尾太長，本次縮短1mm" oninput="newRecordDraft.adjustmentNotes=this.value">${escapeHtml(d.adjustmentNotes)}</textarea>
    </div>
    <div class="form-row">
      <div class="form-field"><label>長度</label>
        <input type="text" value="${escapeHtml(d.length)}" placeholder="例如：8-12mm 混合" oninput="newRecordDraft.length=this.value">
      </div>
      <div class="form-field"><label>翹度</label>
        <input type="text" list="curl-list" value="${escapeHtml(d.curl)}" placeholder="例如：C" oninput="newRecordDraft.curl=this.value">
        <datalist id="curl-list"><option value="J"><option value="B"><option value="C"><option value="CC"><option value="D"><option value="DD"></datalist>
      </div>
    </div>
    <div class="form-row">
      <div class="form-field"><label>粗度</label>
        <input type="text" list="thick-list" value="${escapeHtml(d.thickness)}" placeholder="例如：0.10mm" oninput="newRecordDraft.thickness=this.value">
        <datalist id="thick-list"><option value="0.05mm"><option value="0.07mm"><option value="0.10mm"><option value="0.12mm"><option value="0.15mm"><option value="0.20mm"></datalist>
      </div>
      <div class="form-field">
        <label>根數（左眼／右眼）</label>
        <div style="display:flex;gap:8px;">
          <input type="number" min="0" value="${escapeHtml(d.countLeft)}" placeholder="左眼" oninput="newRecordDraft.countLeft=this.value">
          <input type="number" min="0" value="${escapeHtml(d.countRight)}" placeholder="右眼" oninput="newRecordDraft.countRight=this.value">
        </div>
      </div>
    </div>
    <div class="form-row">
      <div class="form-field"><label>技術</label>
        <select onchange="onTechniqueChange(this.value)">
          ${TECHNIQUES.map(t=>`<option value="${t}" ${d.technique===t?'selected':''}>${t}</option>`).join('')}
        </select>
      </div>
      <div class="form-field" id="technique-other-wrap" ${d.technique==='其他'?'':'hidden'}>
        <label>技術說明</label>
        <input type="text" value="${escapeHtml(d.techniqueOther)}" placeholder="請輸入技術名稱" oninput="newRecordDraft.techniqueOther=this.value">
      </div>
    </div>
    <div class="form-field" style="margin-bottom:4px;">
      <label>其他備註（選填）</label>
      <textarea placeholder="例如：客人指定樣式、其他提醒…" oninput="newRecordDraft.notes=this.value">${escapeHtml(d.notes)}</textarea>
    </div>
    <div id="new-record-error" style="color:var(--alert);font-size:12.5px;margin-bottom:6px;"></div>
    <div class="form-actions">
      <button class="btn-ghost btn" onclick="cancelNewRecord()">取消</button>
      <button class="btn" onclick="saveNewRecord()">${d.id?'更新紀錄':'儲存紀錄'}</button>
    </div>
  </div>`;
}
function onTechniqueChange(val){
  newRecordDraft.technique = val;
  render();
}
async function saveNewRecord(){
  const d = newRecordDraft;
  if(!d.date){
    const el = document.getElementById('new-record-error');
    if(el) el.textContent = '請選擇日期';
    return;
  }
  let clientId = d.clientId;
  if(!clientId){
    const name = (d.clientPickerName||'').trim();
    if(!name){
      const el = document.getElementById('new-record-error');
      if(el) el.textContent = '請輸入客人姓名';
      return;
    }
    const existing = clients.find(c=>c.name===name);
    if(existing){
      clientId = existing.id;
    }else{
      clientId = uid('client');
      clients.push({
        id: clientId, name, phone:'', igLine:'', birthday: d.clientBirthday||'', firstVisitDate: d.date, source:'', sourceOther:'',
        createdAt: todayStr(), status: blankStatus(), statusUpdatedAt: null,
        contraindications: [], tags: [], serviceRecords: [],
      });
    }
  }
  const client = clients.find(c=>c.id===clientId);
  client.serviceRecords = client.serviceRecords||[];
  const payload = {
    id: d.id || uid('rec'),
    clientId,
    date: d.date,
    time: d.time||'', duration: d.duration||'', service: d.service||'', serviceOther: d.serviceOther||'',
    status: d.status||'confirmed', amount: d.amount||'', deposit: d.deposit||'',
    lenLL: d.lenLL||'', lenLM: d.lenLM||'', lenLR: d.lenLR||'',
    lenRL: d.lenRL||'', lenRM: d.lenRM||'', lenRR: d.lenRR||'',
    style: d.style||'', length: d.length||'', curl: d.curl||'', thickness: d.thickness||'',
    countLeft: d.countLeft||'', countRight: d.countRight||'',
    technique: d.technique||'', techniqueOther: d.techniqueOther||'',
    designNotes: d.designNotes||'', adjustmentNotes: d.adjustmentNotes||'', notes: d.notes||'',
  };
  if(d.consentAgreed){
    payload.consentAgreed = true;
    payload.consentAgreedAt = d.consentAgreedAt;
    payload.signatureDataUrl = d.signatureDataUrl;
  }else if(d.id){
    // Editing an existing record: keep whatever consent/signature it already had.
    const existing = client.serviceRecords.find(r=>r.id===d.id);
    if(existing && existing.consentAgreed){
      payload.consentAgreed = true;
      payload.consentAgreedAt = existing.consentAgreedAt;
      payload.signatureDataUrl = existing.signatureDataUrl;
    }
  }
  if(d.id){
    const idx = client.serviceRecords.findIndex(r=>r.id===d.id);
    if(idx>-1) client.serviceRecords[idx] = payload; else client.serviceRecords.push(payload);
  }else{
    client.serviceRecords.push(payload);
  }
  newRecordDraft = null;
  await saveData();
  showToast(d.id ? '已更新紀錄' : '已新增紀錄');
  render();
}

function attachDetailBehaviors(client){
  // placeholder for future DOM-level bindings if needed
}

/* ============ Init ============ */
(async function init(){
  await loadData();
  await loadCustomStyles();
  render();
})();

let __resizeTimer;
window.addEventListener('resize', ()=>{
  clearTimeout(__resizeTimer);
  __resizeTimer = setTimeout(()=>{ if(view==='calendar') render(); }, 200);
});
</script>
