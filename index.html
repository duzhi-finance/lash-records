<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EYELASH · 客戶紀錄管理</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Noto+Serif+TC:wght@600;700&family=Montserrat:wght@700;800&family=Noto+Sans+TC:wght@400;500;600;700&display=swap');
:root{
  --font-sans: ui-rounded, "Noto Sans TC", -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", "Helvetica Neue", Arial, sans-serif;
  --font-serif: 'Cormorant Garamond', 'Noto Serif TC', Georgia, 'Times New Roman', serif;
  --paper:#FAF6F2;
  --paper-deep:#F2E8DF;
  --ink:#4A4038;
  --ink-soft:#96897F;
  --ink-faint:#C7BAAF;
  --mocha:#C39A8C;
  --mocha-deep:#A97C6C;
  --blush:#EDDDD3;
  --blush-line:#DFC9BC;
  --alert:#9B6A4A;
  --alert-bg:#F3E3D6;
  --alert-line:#E2C7AE;
  --warn:#6B6459;
  --warn-bg:#EDEBE4;
  --warn-line:#D9D3C6;
  --sage:#4A4038;
  --sage-bg:#F1E7DD;
  --radius-card:14px;
  --radius-pill:999px;
  --radius-ui:9px;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font-sans);
  font-size:15px;
  line-height:1.6;
  min-height:100vh;
}
h1,h2,h3{
  font-family:var(--font-sans);
  font-weight:600;
  color:var(--ink);
  margin:0;
}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;font-size:14px;}
:focus-visible{outline:2px solid var(--mocha-deep);outline-offset:2px;}

#app{max-width:960px;margin:0 auto;padding:32px 24px 80px;}

/* ---------- Top bar ---------- */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:26px;flex-wrap:wrap;gap:12px;
  background:var(--paper-deep);
  border-radius:var(--radius-card);
  padding:20px 24px;
}
.brand{display:flex;flex-direction:column;gap:4px;}
.brand-row{display:flex;align-items:baseline;gap:12px;}
.brand-en{
  font-family:'Montserrat', var(--font-sans);
  font-size:10.5px;letter-spacing:2.5px;text-transform:uppercase;color:var(--ink-faint);
}
.brand .wordmark{
  font-family:var(--font-serif);
  font-size:30px;letter-spacing:0.5px;font-weight:700;color:var(--mocha-deep);
}
.brand span.sub{font-size:12.5px;color:var(--ink-soft);}
.list-footer{margin-top:40px;padding-top:20px;border-top:1px solid var(--blush-line);text-align:center;}
.list-footer-en{
  font-family:'Montserrat', var(--font-sans);
  font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--ink-faint);
}

.btn{
  border:1px solid var(--mocha);
  background:var(--mocha);
  color:#fff;
  padding:9px 18px;
  border-radius:var(--radius-pill);
  font-size:14px;
  font-weight:500;
  transition:background .15s ease, transform .05s ease;
}
.btn:hover{background:var(--mocha-deep);border-color:var(--mocha-deep);}
.btn:active{transform:translateY(1px);}
.btn-ghost{
  background:#fff;color:var(--ink);border:1px solid var(--blush-line);border-radius:var(--radius-pill);
}
.btn-ghost:hover{background:var(--sage-bg);}
.btn-text{
  background:none;border:none;color:var(--mocha-deep);padding:6px 4px;
  font-size:13.5px;
}
.btn-danger-text{
  background:none;border:none;color:var(--ink-soft);padding:6px 4px;
  font-size:13px;
}
.btn-danger-text:hover{color:var(--alert);}
.btn-sage{
  border:1px solid var(--ink);background:var(--ink);color:#fff;
  padding:9px 18px;border-radius:var(--radius-pill);font-size:14px;font-weight:500;
}
.btn-sage:hover{background:#000;}
.btn-sm{padding:6px 14px;font-size:13px;}

/* ---------- Top bar action group ---------- */
.topbar-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}

/* ---------- Storage notice ---------- */
.storage-notice{
  display:flex;align-items:flex-start;gap:10px;
  background:var(--warn-bg);
  border:1px solid var(--warn-line);
  color:var(--warn);
  border-radius:var(--radius-card);
  padding:14px 16px;
  margin-bottom:20px;
  font-size:13px;
  line-height:1.6;
}
.storage-notice .icon{flex-shrink:0;font-size:16px;line-height:1.4;}
.storage-notice strong{font-weight:700;}

/* ---------- List view ---------- */
.search-row{margin-bottom:20px;}
.search-input{
  width:100%;padding:11px 16px;
  border:1px solid var(--blush-line);
  border-radius:var(--radius-ui);
  background:#fff;
  font-size:14.5px;
}
.client-list{display:flex;flex-direction:column;border:1px solid var(--blush-line);border-radius:var(--radius-card);overflow:hidden;}
.client-card{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 18px;
  border-bottom:1px solid var(--blush-line);
  cursor:pointer;
  gap:14px;
  background:#fff;
}
.client-card:last-child{border-bottom:none;}
.client-card:hover{background:var(--sage-bg);}
.client-main{display:flex;flex-direction:column;gap:3px;min-width:0;}
.client-name{font-family:var(--font-serif);font-size:19px;font-weight:700;}
.client-meta{font-size:12.5px;color:var(--ink-soft);}
.client-side{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.tag-count{
  display:inline-flex;align-items:center;gap:5px;
  background:var(--warn-bg);color:var(--warn);
  border:1px solid var(--warn-line);
  padding:4px 10px;border-radius:var(--radius-pill);
  font-size:12px;font-weight:600;
}
.quick-add-btn{
  width:30px;height:30px;border-radius:50%;
  background:var(--mocha);color:#fff;border:none;
  font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.quick-add-btn:hover{background:var(--mocha-deep);}
.empty-state{
  padding:60px 20px;text-align:center;color:var(--ink-soft);
}
.empty-state h3{margin-bottom:8px;font-size:18px;color:var(--ink);}

/* ---------- Detail view ---------- */
.back-row{margin-bottom:16px;}
.client-card-hero{
  background:var(--paper-deep);
  border-radius:var(--radius-card);
  padding:20px 22px;
  margin-bottom:18px;
}
.client-card-top{
  display:flex;justify-content:space-between;align-items:flex-start;
  gap:16px;flex-wrap:wrap;margin-bottom:12px;
}
.client-card-top h1{font-family:var(--font-serif);font-size:28px;font-weight:700;}
.card-info-row{display:flex;flex-wrap:wrap;gap:8px 16px;margin-bottom:14px;}
.card-info-item{font-size:13px;color:var(--ink-soft);}
.client-tags-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-top:12px;border-top:1px solid var(--blush-line);}
.client-tag-pill{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--blush);color:var(--mocha-deep);
  padding:4px 6px 4px 11px;border-radius:var(--radius-pill);font-size:12.5px;font-weight:500;
}
.client-tag-pill button{
  background:var(--mocha-deep);color:#fff;border:none;border-radius:50%;
  width:14px;height:14px;font-size:9.5px;line-height:1;display:flex;align-items:center;justify-content:center;
}
.client-tag-add{display:inline-flex;gap:6px;align-items:center;}
.client-tag-add input{
  padding:5px 10px;border:1px solid var(--blush-line);border-radius:var(--radius-pill);
  background:#fff;font-size:12.5px;width:150px;
}
.client-tag-add button{
  background:var(--mocha);color:#fff;border:none;border-radius:50%;
  width:22px;height:22px;font-size:13px;line-height:1;cursor:pointer;
}

/* Contraindication banner - always visible, neutral gray/khaki so it doesn't compete with brand accent colors */
.banner-alert{
  background:var(--warn-bg);
  border:1px solid var(--warn-line);
  border-radius:var(--radius-card);
  padding:16px 18px;
  margin-bottom:22px;
}
.banner-alert .banner-title{
  display:flex;align-items:center;gap:8px;
  font-weight:600;color:var(--warn);font-size:14.5px;margin-bottom:10px;
}
.tag-pills{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
.tag-pill{
  display:inline-flex;align-items:center;gap:8px;
  background:#fff;border:1px solid var(--warn-line);color:var(--warn);
  padding:6px 8px 6px 12px;border-radius:var(--radius-pill);font-size:13.5px;font-weight:500;
}
.tag-pill button{
  background:var(--warn);color:#fff;border:none;border-radius:50%;
  width:16px;height:16px;font-size:11px;line-height:1;display:flex;align-items:center;justify-content:center;
}
.tag-empty{color:#A69A8E;font-size:13.5px;}
.tag-add-row{display:flex;gap:8px;}
.tag-add-row input{
  flex:1;padding:8px 12px;border:1px solid var(--warn-line);border-radius:var(--radius-ui);
  background:#fff;font-size:13.5px;
}
.tag-add-row button{
  background:var(--warn);color:#fff;border:1px solid var(--warn);
  padding:8px 16px;border-radius:var(--radius-pill);font-size:13.5px;font-weight:500;
}

/* Tab switcher: 客人狀況 / 服務紀錄 (stacked full-width, avoids a long side-by-side scroll on mobile) */
.detail-tabs{display:flex;gap:8px;margin-bottom:16px;}
.detail-tab-btn{
  flex:1;background:#fff;border:1px solid var(--blush-line);color:var(--ink-soft);
  padding:10px 16px;border-radius:var(--radius-pill);font-size:13.5px;font-weight:500;
  text-align:center;
}
.detail-tab-btn.active{background:var(--ink);color:#fff;border-color:var(--ink);}
.revisit-flag{color:var(--mocha-deep);font-weight:600;}
.prev-record-ref{
  background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:var(--radius-ui);
  padding:10px 12px;margin-bottom:10px;font-size:12.5px;color:var(--ink-soft);line-height:1.5;
}
.prev-record-ref-title{font-weight:600;color:var(--warn);margin-bottom:3px;}

.panel{
  background:#fff;
  border:1px solid var(--blush-line);
  border-radius:var(--radius-card);
  padding:20px 20px 22px;
}
.panel-title{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:16px;
}
.panel-title h2{font-size:16px;}
.panel-title small{font-size:11.5px;color:var(--ink-faint);}

.status-field{margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--blush-line);}
.status-field:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
.status-field label{
  display:block;font-size:13px;color:var(--ink);margin-bottom:8px;font-weight:500;
}
.tri-toggle{display:inline-flex;border:1px solid var(--blush-line);border-radius:var(--radius-pill);overflow:hidden;}
.tri-toggle button{
  background:#fff;border:none;padding:6px 14px;font-size:13px;color:var(--ink-soft);
  border-right:1px solid var(--blush-line);
}
.tri-toggle button:last-child{border-right:none;}
.tri-toggle button.active-yes,
.tri-toggle button.active-no,
.tri-toggle button.active-unknown{background:var(--ink);color:#fff;}
.status-field input[type="text"], .status-field input[type="date"]{
  width:100%;padding:8px 10px;border:1px solid var(--blush-line);border-radius:var(--radius-ui);
  background:#fff;font-size:13.5px;
}
.status-note{
  margin-top:8px;width:100%;padding:7px 9px;border:1px solid var(--blush-line);
  border-radius:var(--radius-ui);background:#fff;font-size:13px;resize:vertical;min-height:38px;
}
.status-footer{
  display:flex;align-items:center;justify-content:space-between;margin-top:16px;
  padding-top:16px;border-top:1px solid var(--blush-line);
}
.status-updated{font-size:11.5px;color:var(--ink-faint);}

/* Service records */
.service-history{display:flex;flex-direction:column;gap:10px;}
.record-card{
  background:#fff;border:1px solid var(--blush-line);border-radius:var(--radius-card);
  padding:15px 18px;
}
.record-top{display:flex;justify-content:space-between;align-items:baseline;cursor:pointer;gap:10px;}
.record-date{font-size:15.5px;font-weight:600;}
.record-tech{font-size:12px;color:var(--mocha-deep);background:var(--blush);padding:3px 11px;border-radius:var(--radius-pill);}
.record-summary{font-size:12.5px;color:var(--ink-soft);margin-top:4px;}
.record-body{margin-top:12px;padding-top:12px;border-top:1px solid var(--blush-line);}
.record-detail-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-bottom:14px;}
.record-detail-item label{display:block;font-size:11px;color:var(--ink-faint);margin-bottom:2px;}
.record-detail-item span{font-size:13.5px;}
.record-notes{font-size:13px;color:var(--ink-soft);margin-top:8px;white-space:pre-wrap;}

/* Eye diagrams */
.eye-diagrams{display:flex;gap:16px;margin-bottom:6px;flex-wrap:wrap;}
.eye-diagram-block{flex:1;min-width:150px;}
.eye-diagram-block .eye-label{font-size:11.5px;color:var(--ink-soft);margin-bottom:5px;text-align:center;}
.eye-svg-wrap{
  background:#fff;border:1px solid var(--blush-line);border-radius:var(--radius-ui);
  padding:6px;
}
.eye-svg-wrap svg{width:100%;height:auto;display:block;cursor:crosshair;}
.eye-outline{fill:var(--blush);stroke:var(--mocha);stroke-width:2;}
.eye-mark-dot{fill:var(--mocha-deep);stroke:#fff;stroke-width:1.2;cursor:pointer;}
.eye-shape-select{
  width:100%;padding:6px 8px;margin-bottom:6px;border:1px solid var(--blush-line);
  border-radius:var(--radius-ui);font-size:12.5px;background:#fff;
}
.eye-diagram-hint{font-size:11px;color:var(--ink-faint);text-align:center;margin-top:5px;}

/* New service form */
.new-record-panel{
  background:#fff;border:1px solid var(--blush-line);border-radius:var(--radius-card);
  padding:20px 20px 18px;margin-bottom:16px;
}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}
@media (max-width:480px){.form-row{grid-template-columns:1fr;}}
.form-field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:5px;font-weight:500;}
.form-field input, .form-field select, .form-field textarea{
  width:100%;padding:8px 10px;border:1px solid var(--blush-line);border-radius:var(--radius-ui);
  background:#fff;font-size:13.5px;
}
.form-field textarea{resize:vertical;min-height:50px;}
.form-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:14px;}

/* Modal */
.modal-overlay{
  position:fixed;inset:0;background:rgba(43,41,38,0.35);
  display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;
}
.modal-box{
  background:#fff;border:1px solid var(--blush-line);border-radius:var(--radius-card);
  padding:26px;width:100%;max-width:380px;
}
.modal-box h3{font-size:18px;margin-bottom:18px;}
.modal-field{margin-bottom:14px;}
.modal-field label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:5px;}
.modal-field input{
  width:100%;padding:9px 12px;border:1px solid var(--blush-line);border-radius:var(--radius-ui);
  background:#fff;font-size:14px;
}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;}

.footer-links{margin-top:34px;padding-top:16px;border-top:1px solid var(--blush-line);text-align:right;}
</style>
</head>
<body>
<div id="app">載入中…</div>

<script>
/* ============ Storage helpers ============
 * This app runs as a plain static page (GitHub Pages), so all data lives
 * only in this browser's localStorage on this device. There is no server
 * and no sync between devices/browsers — see the export/import backup
 * functions below for how users move data between devices.
 */
const STORAGE_KEY = 'meiye-clients-data';
let clients = [];

async function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    clients = raw ? JSON.parse(raw) : [];
  }catch(e){
    clients = [];
  }
}
async function saveData(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(clients));
  }catch(e){
    console.error('儲存失敗', e);
    showToast('資料儲存失敗，請稍後再試一次（可能是瀏覽器儲存空間已滿）。');
  }
}

function uid(prefix){
  return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
}
function todayStr(){
  return new Date().toISOString().slice(0,10);
}
function fmtDate(d){
  if(!d) return '—';
  return d;
}
function escapeHtml(str){
  if(str===undefined||str===null) return '';
  return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ============ Backup: export / import ============ */
function exportBackup(){
  const payload = {
    app: 'eyelash-client-records',
    version: 1,
    exportedAt: new Date().toISOString(),
    clients,
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `eyelash-backup-${todayStr()}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  showToast('已匯出備份檔案，請妥善保存');
}
function triggerImport(){
  const input = document.getElementById('import-file-input');
  if(input) input.click();
}
function handleImportFile(evt){
  const file = evt.target.files && evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    let parsed;
    try{
      parsed = JSON.parse(e.target.result);
    }catch(err){
      showToast('匯入失敗：檔案不是有效的備份格式');
      evt.target.value='';
      return;
    }
    const importedClients = Array.isArray(parsed) ? parsed
      : (parsed && Array.isArray(parsed.clients) ? parsed.clients : null);
    if(!importedClients){
      showToast('匯入失敗：找不到客戶資料');
      evt.target.value='';
      return;
    }
    const currentCount = clients.length;
    askConfirm(
      `確定要匯入這份備份檔案嗎？匯入後將會取代目前裝置上所有的客戶紀錄（目前共 ${currentCount} 筆，備份檔內有 ${importedClients.length} 筆），此操作無法復原。建議先匯出目前的資料備份。`,
      async ()=>{
        clients = importedClients;
        await saveData();
        view='list'; activeClientId=null;
        render();
        showToast(`已匯入 ${clients.length} 筆客戶紀錄`);
      }
    );
    evt.target.value='';
  };
  reader.onerror = function(){
    showToast('匯入失敗：無法讀取檔案');
    evt.target.value='';
  };
  reader.readAsText(file);
}

/* ============ App state ============ */
let view = 'list';          // 'list' | 'detail'
let activeClientId = null;
let showAddClientModal = false;
let editClientDraft = null; // {id?, name, phone}
let statusDraft = null;     // working copy of client.status while on detail page
let newRecordDraft = null;  // working copy for a new service record
let expandedRecordId = null;
let detailTab = 'status';   // 'status' | 'records'

const STATUS_FIELDS = [
  {key:'isFirstTime', label:'是否第一次接睫毛', tri:true},
  {key:'lastLashDate', label:'上次接睫毛日期', type:'date'},
  {key:'keratin3Months', label:'近三個月是否操作角蛋白', tri:true},
  {key:'frequency', label:'平常接睫毛頻率', type:'text', placeholder:'例如：約3週一次'},
  {key:'hasOldLashesToRemove', label:'目前是否有舊睫毛需要卸除', tri:true},
  {key:'allergyHistory', label:'是否有過敏／敏感史', tri:true, note:true},
  {key:'eyeRednessItchyDry', label:'眼睛是否容易紅癢／乾', tri:true},
  {key:'recentEyeDiscomfort', label:'近期是否有眼睛不適', tri:true, note:true},
  {key:'wearsContacts', label:'平常是否配戴隱形眼鏡', tri:true},
  {key:'rubsEyesOften', label:'平常是否容易揉眼睛', tri:true},
  {key:'specialEyeCondition', label:'是否有特殊眼部狀況', tri:true, note:true},
];

function blankStatus(){
  const s = {};
  STATUS_FIELDS.forEach(f=>{
    if(f.tri) s[f.key] = 'unknown';
    else s[f.key] = '';
    if(f.note) s[f.key+'_note'] = '';
  });
  return s;
}

const EYE_SHAPES = [
  {id:'round', label:'圓眼'},
  {id:'long', label:'長眼'},
  {id:'up', label:'上挑'},
  {id:'down', label:'下垂'},
];
const EYE_PATHS = {
  round: 'M8,62 Q100,10 192,62 Q100,96 8,62 Z',
  long:  'M5,56 Q100,28 195,56 Q100,76 5,56 Z',

function latestServiceDate(client){
  const recs = client.serviceRecords||[];
  if(recs.length===0) return null;
  return recs.slice().sort((a,b)=> b.date.localeCompare(a.date))[0].date;
}
function computeRevisitStats(client){
  const recs = (client.serviceRecords||[]).slice().sort((a,b)=> a.date.localeCompare(b.date));
  if(recs.length < 2) return null;
  const dates = recs.map(r=> new Date(r.date+'T00:00:00'));
  let totalGapDays = 0;
  for(let i=1;i<dates.length;i++){
    totalGapDays += (dates[i]-dates[i-1]) / 86400000;
  }
  const avgDays = totalGapDays / (dates.length-1);
  const lastDate = dates[dates.length-1];
  const todayDate = new Date(todayStr()+'T00:00:00');
  const sinceLastDays = Math.round((todayDate-lastDate)/86400000);
  return {
    avgWeeks: avgDays/7,
    sinceLastWeeks: sinceLastDays/7,
    isOverdue: sinceLastDays > avgDays*1.2,
  };
}

function setStatusTri(key, val){

  const cls = val==='yes'?'active-yes':val==='no'?'active-no':'active-unknown';
  const idx = val==='yes'?0:val==='no'?1:2;
  group.children[idx].classList.add(cls);

function eyeSvgBlock(shapeId, side, marks, editable){
  const d = EYE_PATHS[shapeId] || EYE_PATHS.round;
  const flipStyle = side==='R' ? ' style="transform:scaleX(-1);transform-origin:100px 60px;"' : '';
  const dots = (marks||[]).map(m=>`<circle class="eye-mark-dot" cx="${m.x}" cy="${m.y}" r="4"${editable?` onclick="event.stopPropagation(); removeMark('${side}','${m.id}')"`:''}></circle>`).join('');
  const clickAttr = editable ? ` onclick="handleEyeClick(event,'${side}')"` : '';
  return `<svg viewBox="0 0 200 120"${clickAttr}><g${flipStyle}><path class="eye-outline" d="${d}"></path></g><g id="${editable?('marks-group-'+side):''}">${dots}</g></svg>`;
}

function renderRecordCard(r){
  const expanded = expandedRecordId===r.id;
  const shapeLabel = r.eyeMode==='split' ? `左：${shapeName(r.shapeLeft)}／右：${shapeName(r.shapeRight)}` : shapeName(r.shapeSingle);
  const totalCount = (Number(r.countLeft)||0) + (Number(r.countRight)||0);
  let body = '';
  if(expanded){
    const shapeL = r.eyeMode==='split' ? r.shapeLeft : r.shapeSingle;
    const shapeR = r.eyeMode==='split' ? r.shapeRight : r.shapeSingle;
    body = `<div class="record-body">
      <div class="eye-diagrams">
        <div class="eye-diagram-block">
          <div class="eye-label">左眼</div>
          <div class="eye-svg-wrap">${eyeSvgBlock(shapeL,'L',r.marksL,false)}</div>
        </div>
        <div class="eye-diagram-block">
          <div class="eye-label">右眼</div>
          <div class="eye-svg-wrap">${eyeSvgBlock(shapeR,'R',r.marksR,false)}</div>
        </div>
      </div>
      <div class="record-detail-grid">
        <div class="record-detail-item"><label>眼型</label><span>${shapeLabel}</span></div>
        <div class="record-detail-item"><label>款式</label><span>${escapeHtml(r.style||'—')}</span></div>
        <div class="record-detail-item"><label>長度</label><span>${escapeHtml(r.length||'—')}</span></div>
        <div class="record-detail-item"><label>翹度</label><span>${escapeHtml(r.curl||'—')}</span></div>
        <div class="record-detail-item"><label>粗度</label><span>${escapeHtml(r.thickness||'—')}</span></div>
        <div class="record-detail-item"><label>根數（左／右）</label><span>${escapeHtml(r.countLeft||'—')} ／ ${escapeHtml(r.countRight||'—')}${totalCount?`（共 ${totalCount}）`:''}</span></div>
        <div class="record-detail-item"><label>技術</label><span>${escapeHtml(r.technique==='其他'?(r.techniqueOther||'其他'):r.technique)}</span></div>
      </div>
      ${r.designNotes?`<div class="record-notes"><strong>眼型設計：</strong>${escapeHtml(r.designNotes)}</div>`:''}
      ${r.adjustmentNotes?`<div class="record-notes"><strong>本次調整：</strong>${escapeHtml(r.adjustmentNotes)}</div>`:''}
      ${r.notes?`<div class="record-notes"><strong>備註：</strong>${escapeHtml(r.notes)}</div>`:''}
      <div class="form-actions">
        <button class="btn-ghost btn btn-sm" onclick="startEditRecord('${r.clientId}','${r.id}')">編輯</button>
        <button class="btn-danger-text" onclick="deleteRecord('${r.clientId}','${r.id}')">刪除此筆紀錄</button>
      </div>
    </div>`;
  }
  return `<div class="record-card">
    <div class="record-top" onclick="toggleRecord('${r.id}')">
      <div>
        <div class="record-date">${r.date}</div>
        <div class="record-summary">${escapeHtml(r.style?r.style+' · ':'')}${shapeLabel} · ${escapeHtml(r.length||'')} ${escapeHtml(r.curl||'')} ${escapeHtml(r.thickness||'')}</div>
      </div>
      <span class="record-tech">${escapeHtml(r.technique==='其他'?(r.techniqueOther||'其他'):r.technique)}</span>
    </div>
    ${body}
  </div>`;
}
function shapeName(id){
  const found = EYE_SHAPES.find(s=>s.id===id);
  return found ? found.label : '未選擇';
}
function findLatestRecord(clientId, excludeId){
  const client = clients.find(c=>c.id===clientId);
  const recs = (client.serviceRecords||[]).filter(r=>r.id!==excludeId).slice().sort((a,b)=> b.date.localeCompare(a.date));
  return recs[0] || null;
}
function summarizeRecord(r){
  if(!r) return '';
  const shapeLabel = r.eyeMode==='split' ? `左：${shapeName(r.shapeLeft)}／右：${shapeName(r.shapeRight)}` : shapeName(r.shapeSingle);
  const techLabel = r.technique==='其他' ? (r.techniqueOther||'其他') : r.technique;
  return [r.style, shapeLabel, r.length, r.curl, r.thickness, techLabel].filter(Boolean).join(' · ');
}
function toggleRecord(id){
  expandedRecordId = expandedRecordId===id ? null : id;
  render();
}
function deleteRecord(clientId, recordId){
  askConfirm('確定要刪除這筆服務紀錄嗎？', async ()=>{
    const client = clients.find(c=>c.id===clientId);
    client.serviceRecords = client.serviceRecords.filter(r=>r.id!==recordId);
    await saveData();
    render();
  });
}

/* ---- New / edit record form ---- */
function startNewRecord(clientId){
  newRecordDraft = {
    clientId, id: null,
    date: todayStr(),
    eyeMode:'single',
    shapeSingle:'round', shapeLeft:'round', shapeRight:'round',
    marksL:[], marksR:[],
    style:'', length:'', curl:'', thickness:'', countLeft:'', countRight:'',
    technique:'單根', techniqueOther:'', designNotes:'', adjustmentNotes:'', notes:'',
  };
  render();
  const panel = document.getElementById('new-record-panel');
  if(panel) panel.scrollIntoView({behavior:'smooth', block:'nearest'});
}
function startEditRecord(clientId, recordId){
  const client = clients.find(c=>c.id===clientId);
  const r = client.serviceRecords.find(x=>x.id===recordId);
  if(!r) return;
  newRecordDraft = {
    clientId, id: r.id,
    date: r.date,
    eyeMode: r.eyeMode,
    shapeSingle: r.shapeSingle || 'round',
    shapeLeft: r.shapeLeft || r.shapeSingle || 'round',
    shapeRight: r.shapeRight || r.shapeSingle || 'round',
    marksL: JSON.parse(JSON.stringify(r.marksL||[])),
    marksR: JSON.parse(JSON.stringify(r.marksR||[])),
    style: r.style||'', length: r.length||'', curl: r.curl||'', thickness: r.thickness||'',
    countLeft: r.countLeft||'', countRight: r.countRight||'',
    technique: r.technique||'單根', techniqueOther: r.techniqueOther||'',
    designNotes: r.designNotes||'', adjustmentNotes: r.adjustmentNotes||'', notes: r.notes||'',
  };
  expandedRecordId = null;
  render();
  const panel = document.getElementById('new-record-panel');
  if(panel) panel.scrollIntoView({behavior:'smooth', block:'nearest'});
}
function cancelNewRecord(){
  newRecordDraft = null; render();
}
function renderNewRecordPanel(){
  const d = newRecordDraft;
  const shapeOptions = (val)=>EYE_SHAPES.map(s=>`<option value="${s.id}" ${val===s.id?'selected':''}>${s.label}</option>`).join('');
  const isSplit = d.eyeMode==='split';
  const shapeSelectors = isSplit ? `
    <div class="form-row">
      <div class="form-field"><label>左眼型</label>
        <select onchange="setRecordShapeSplit('left', this.value)">${shapeOptions(d.shapeLeft)}</select>
      </div>
      <div class="form-field"><label>右眼型</label>
        <select onchange="setRecordShapeSplit('right', this.value)">${shapeOptions(d.shapeRight)}</select>
      </div>
    </div>` : `
    <div class="form-field" style="margin-bottom:12px;">
      <label>眼型</label>
      <select onchange="setRecordShapeSingle(this.value)">${shapeOptions(d.shapeSingle)}</select>
    </div>`;

  const shapeL = isSplit ? d.shapeLeft : d.shapeSingle;
  const shapeR = isSplit ? d.shapeRight : d.shapeSingle;
  const prevRecord = findLatestRecord(d.clientId, d.id);
  const prevRefHtml = prevRecord ? `<div class="prev-record-ref">
      <div class="prev-record-ref-title">上一筆紀錄參考（${prevRecord.date}）</div>
      <div>${escapeHtml(summarizeRecord(prevRecord))}</div>
      ${prevRecord.adjustmentNotes?`<div>上次調整：${escapeHtml(prevRecord.adjustmentNotes)}</div>`:''}
    </div>` : '';

  return `<div class="new-record-panel" id="new-record-panel">
    <div style="font-weight:600;font-size:15px;margin-bottom:14px;">${d.id?'編輯服務紀錄':'新增服務紀錄'}</div>
    <div class="form-row">
      <div class="form-field"><label>日期</label>
        <input type="date" value="${d.date}" oninput="newRecordDraft.date=this.value">
      </div>
      <div class="form-field"><label>眼型模式</label>
        <select onchange="setEyeMode(this.value)">
          <option value="single" ${!isSplit?'selected':''}>單一眼型（圓眼／長眼／上挑／下垂）</option>
          <option value="split" ${isSplit?'selected':''}>左右大小眼（分開設定）</option>
        </select>
      </div>
    </div>
    ${shapeSelectors}
    <div class="form-field" style="margin-bottom:12px;">
      <label>款式</label>
      <input type="text" value="${escapeHtml(d.style)}" placeholder="例如：自然款、精緻款" oninput="newRecordDraft.style=this.value">
    </div>
    <div class="form-field" style="margin-bottom:14px;">
      <label>眼睛示意圖標記（點擊圖上位置標記設計細節，點已標記的點可移除）</label>
      <div class="eye-diagrams">
        <div class="eye-diagram-block">
          <div class="eye-label">左眼</div>
          <div class="eye-svg-wrap">${eyeSvgBlock(shapeL,'L',d.marksL,true)}</div>
        </div>
        <div class="eye-diagram-block">
          <div class="eye-label">右眼</div>
          <div class="eye-svg-wrap">${eyeSvgBlock(shapeR,'R',d.marksR,true)}</div>
        </div>
      </div>
      <div class="eye-diagram-hint">點擊眼型圖標記設計位置（例如：加長段、加粗段、特殊角度）</div>
    </div>
    <div class="form-field" style="margin-bottom:12px;">
      <label>眼型設計說明（選填）</label>
      <textarea placeholder="例如：中間加長，眼尾稍微收短" oninput="newRecordDraft.designNotes=this.value">${escapeHtml(d.designNotes)}</textarea>
    </div>
    <div class="form-field" style="margin-bottom:12px;">
      <label>本次調整（選填，依上次回饋）</label>
      ${prevRefHtml}
      <textarea placeholder="例如：上次客人覺得眼尾太長，本次縮短1mm" oninput="newRecordDraft.adjustmentNotes=this.value">${escapeHtml(d.adjustmentNotes)}</textarea>
    </div>
    <div class="form-row">
      <div class="form-field"><label>長度</label>
        <input type="text" value="${escapeHtml(d.length)}" placeholder="例如：8-12mm 混合" oninput="newRecordDraft.length=this.value">
      </div>
      <div class="form-field"><label>翹度</label>
        <input type="text" list="curl-list" value="${escapeHtml(d.curl)}" placeholder="例如：C" oninput="newRecordDraft.curl=this.value">
        <datalist id="curl-list"><option value="J"><option value="B"><option value="C"><option value="CC"><option value="D"><option value="DD"></datalist>
      </div>
    </div>
    <div class="form-row">
      <div class="form-field"><label>粗度</label>
        <input type="text" list="thick-list" value="${escapeHtml(d.thickness)}" placeholder="例如：0.10mm" oninput="newRecordDraft.thickness=this.value">
        <datalist id="thick-list"><option value="0.05mm"><option value="0.07mm"><option value="0.10mm"><option value="0.12mm"><option value="0.15mm"><option value="0.20mm"></datalist>
      </div>
      <div class="form-field">
        <label>根數（左眼／右眼）</label>
        <div style="display:flex;gap:8px;">
          <input type="number" min="0" value="${escapeHtml(d.countLeft)}" placeholder="左眼" oninput="newRecordDraft.countLeft=this.value">
          <input type="number" min="0" value="${escapeHtml(d.countRight)}" placeholder="右眼" oninput="newRecordDraft.countRight=this.value">
        </div>
      </div>
    </div>
    <div class="form-row">
      <div class="form-field"><label>技術</label>
        <select onchange="onTechniqueChange(this.value)">
          ${TECHNIQUES.map(t=>`<option value="${t}" ${d.technique===t?'selected':''}>${t}</option>`).join('')}
        </select>
      </div>
      <div class="form-field" id="technique-other-wrap" style="${d.technique==='其他'?'':'visibility:hidden'}">
        <label>技術說明</label>
        <input type="text" value="${escapeHtml(d.techniqueOther)}" placeholder="請輸入技術名稱" oninput="newRecordDraft.techniqueOther=this.value">
      </div>
    </div>
    <div class="form-field" style="margin-bottom:4px;">
      <label>其他備註（選填）</label>
      <textarea placeholder="例如：客人指定樣式、其他提醒…" oninput="newRecordDraft.notes=this.value">${escapeHtml(d.notes)}</textarea>
    </div>
    <div id="new-record-error" style="color:var(--alert);font-size:12.5px;margin-bottom:6px;"></div>
    <div class="form-actions">
      <button class="btn-ghost btn" onclick="cancelNewRecord()">取消</button>
      <button class="btn" onclick="saveNewRecord()">${d.id?'更新紀錄':'儲存紀錄'}</button>
    </div>
  </div>`;
}
function setEyeMode(mode){
  newRecordDraft.eyeMode = mode;
  render();
}
function setRecordShapeSingle(val){
  newRecordDraft.shapeSingle = val;
  render();
}
function setRecordShapeSplit(side, val){
  if(side==='left') newRecordDraft.shapeLeft = val; else newRecordDraft.shapeRight = val;
  render();
}
function onTechniqueChange(val){
  newRecordDraft.technique = val;
  render();
}
function handleEyeClick(evt, side){
  const svg = evt.currentTarget;
  const pt = svg.createSVGPoint();
  pt.x = evt.clientX; pt.y = evt.clientY;
  const ctm = svg.getScreenCTM().inverse();
  const p = pt.matrixTransform(ctm);
  const mark = {id: uid('mark'), x: Math.round(p.x*10)/10, y: Math.round(p.y*10)/10};
  const arr = side==='L' ? newRecordDraft.marksL : newRecordDraft.marksR;
  arr.push(mark);
  const g = document.getElementById('marks-group-'+side);
  const c = document.createElementNS('http://www.w3.org/2000/svg','circle');
  c.setAttribute('class','eye-mark-dot');
  c.setAttribute('cx', mark.x);
  c.setAttribute('cy', mark.y);
  c.setAttribute('r', 4);
  c.setAttribute('data-id', mark.id);
  c.onclick = function(e){ e.stopPropagation(); removeMark(side, mark.id); };
  g.appendChild(c);
}
function removeMark(side, id){
  const arr = side==='L' ? newRecordDraft.marksL : newRecordDraft.marksR;
  const idx = arr.findIndex(m=>m.id===id);
  if(idx>-1) arr.splice(idx,1);
  const g = document.getElementById('marks-group-'+side);
  const el = g.querySelector(`[data-id="${id}"]`);
  if(el) el.remove();
}
async function saveNewRecord(){
  const d = newRecordDraft;
  if(!d.date){
    const el = document.getElementById('new-record-error');
    if(el) el.textContent = '請選擇日期';
    return;
  }
  const client = clients.find(c=>c.id===d.clientId);
  client.serviceRecords = client.serviceRecords||[];
  const payload = {
    id: d.id || uid('rec'),
    clientId: d.clientId,
    date: d.date,
    eyeMode: d.eyeMode,
    shapeSingle: d.shapeSingle, shapeLeft: d.shapeLeft, shapeRight: d.shapeRight,
    marksL: d.marksL, marksR: d.marksR,
    style: d.style, length: d.length, curl: d.curl, thickness: d.thickness,
    countLeft: d.countLeft, countRight: d.countRight,
    technique: d.technique, techniqueOther: d.techniqueOther,
    designNotes: d.designNotes, adjustmentNotes: d.adjustmentNotes, notes: d.notes,
  };
  if(d.id){
    const idx = client.serviceRecords.findIndex(r=>r.id===d.id);
    if(idx>-1) client.serviceRecords[idx] = payload; else client.serviceRecords.push(payload);
  }else{
    client.serviceRecords.push(payload);
  }
  newRecordDraft = null;
  await saveData();
  showToast(d.id ? '已更新服務紀錄' : '已新增服務紀錄');
  render();
}

function attachDetailBehaviors(client){
  // placeholder for future DOM-level bindings if needed
}

/* ============ Init ============ */
(async function init(){
  await loadData();
  render();
})();
</script>
